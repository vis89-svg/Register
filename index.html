<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>Koda - Everything you want answered</title>
  <link rel="icon" type="image/png" href="koda-logo.png">
  <script src="koda-transition.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0b0b0b;
      --muted: #8a8a8a;
      --neon: #ffd400;
      --toggle-border: #e4e4e4;
      --ring-opacity: 0.22;
      --ring-glow: none;
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --text: #f5f5f5;
      --muted: #7a7a7a;
      --neon: #ffd400;
      --toggle-border: #262626;
      --ring-opacity: 0.45;
      --ring-glow: none;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--toggle-border);
      background: transparent;
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-color 0.35s, transform 0.2s;
      z-index: 10;
    }

    .theme-toggle:hover { transform: rotate(20deg); }
    .theme-toggle svg { grid-area: 1 / 1; transition: opacity 0.3s, transform 0.4s; }
    .theme-toggle .moon { opacity: 0; transform: rotate(-90deg) scale(0.6); }
    :root[data-theme="dark"] .theme-toggle .sun { opacity: 0; transform: rotate(90deg) scale(0.6); }
    :root[data-theme="dark"] .theme-toggle .moon { opacity: 1; transform: none; }

    /* Background: neon rings rippling out from the middle, forever */
    .rings {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.4s ease;
    }

    .rings span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 130vmax;
      height: 130vmax;
      margin: -65vmax 0 0 -65vmax;
      border-radius: 50%;
      border: 1.5px solid var(--neon);
      box-shadow: var(--ring-glow);
      opacity: 0;
      transform: scale(0.04);
      animation: ripple 12s linear infinite;
    }

    .rings span:nth-child(2) { animation-delay: -3s; }
    .rings span:nth-child(3) { animation-delay: -6s; }
    .rings span:nth-child(4) { animation-delay: -9s; }

    @keyframes ripple {
      0% { transform: scale(0.04); opacity: 0; }
      12% { opacity: var(--ring-opacity); }
      100% { transform: scale(1); opacity: 0; }
    }

    .k-leaving .rings { opacity: 0; }

    .hero {
      position: relative;
      z-index: 1;
      padding: 0 8vw;
      font-weight: 700;
      font-size: clamp(2.6rem, 8.5vw, 7rem);
      line-height: 1.02;
      letter-spacing: -0.035em;
    }

    .line {
      display: block;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      animation-delay: calc(var(--i) * 110ms + 100ms);
    }

    .line.half { display: inline-block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    .plain, .tag {
      display: inline-block;
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.6, 0, 0.3, 1), filter 0.45s ease, text-shadow 0.3s ease;
    }

    .tag {
      position: relative;
      color: var(--neon);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    /* The # draws itself stroke by stroke, then the word slides out from behind it */
    .hash {
      display: inline-block;
      width: 0.62em;
      height: 0.72em;
      margin-right: 0.03em;
      vertical-align: -0.02em;
      overflow: visible;
    }

    .hash line {
      stroke: currentColor;
      stroke-width: 12;
      stroke-linecap: square;
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
    }

    .tag.draw .hash line {
      stroke-dashoffset: 1;
      animation: draw-stroke 0.32s cubic-bezier(0.6, 0, 0.3, 1) forwards;
      animation-delay: calc(var(--base, 0s) + var(--n) * 0.14s);
    }

    @keyframes draw-stroke { to { stroke-dashoffset: 0; } }

    /* #Koda: the # keeps writing itself - draw, hold, wipe away, draw again */
    .tag.loop .hash line {
      animation: hash-loop 3.4s cubic-bezier(0.6, 0, 0.3, 1) infinite both;
      animation-delay: calc(var(--base) + var(--n) * 0.14s);
    }

    @keyframes hash-loop {
      0% { stroke-dashoffset: 1; }
      13% { stroke-dashoffset: 0; }
      74% { stroke-dashoffset: 0; }
      88% { stroke-dashoffset: -1; }
      100% { stroke-dashoffset: -1; }
    }

    .word { display: inline-block; }

    /* A small arrow after #GoWebsite shows it's a link */
    .go-arrow {
      display: inline-block;
      width: 0.5em;
      height: 0.5em;
      margin-left: 0.08em;
      vertical-align: 0.36em;
      opacity: 0;
      animation: arrow-in 0.4s ease forwards;
      animation-delay: calc(var(--base) + 1.1s);
    }

    @keyframes arrow-in {
      from { opacity: 0; transform: translate(-0.12em, 0.12em); }
      to { opacity: 1; transform: none; }
    }

    .tag.intro .word {
      clip-path: inset(0 100% 0 0);
      transform: translateX(-0.35em);
      animation: word-out 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      animation-delay: calc(var(--base) + 0.6s);
    }

    @keyframes word-out { to { clip-path: inset(0 0 0 0); transform: none; } }

    /* Underline: always on #Koda (drawn after the word appears), on hover for #GoWebsite */
    .tag::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.06em;
      height: 0.075em;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.6, 0, 0.3, 1);
    }

    /* #Koda's underline writes and wipes in step with its #, just behind it */
    .tag.koda::after {
      animation: underline-loop 3.4s cubic-bezier(0.6, 0, 0.3, 1) infinite both;
      animation-delay: calc(var(--base) + 0.75s);
    }

    .tag:hover::after { transform: scaleX(1); }

    @keyframes underline-loop {
      0% { transform: scaleX(0); transform-origin: left; }
      13% { transform: scaleX(1); transform-origin: left; }
      74% { transform: scaleX(1); transform-origin: right; }
      88% { transform: scaleX(0); transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }
    .tag:focus-visible { outline: 3px solid var(--neon); outline-offset: 6px; border-radius: 6px; }

    /* Leaving: everything except the clicked tag floats up and blurs away, one after another */
    .k-leaving .plain, .k-leaving .tag:not(.k-chosen) {
      opacity: 0;
      transform: translateY(-28px);
      filter: blur(12px);
      transition-delay: calc(var(--i) * 70ms);
    }

    .k-leaving .tag.k-chosen {
      transform: scale(1.08);
      color: var(--neon);
    }

    /* As the neon ring sweeps out, the chosen tag dissolves into it */
    .k-wiping .tag.k-chosen {
      opacity: 0;
      transform: scale(1.3);
      filter: blur(8px);
      transition-duration: 0.4s;
    }

    .k-leaving .theme-toggle { opacity: 0; transition: opacity 0.3s; }

    /* Phones: big text, grouped in the middle of the screen with even gaps */
    @media (max-width: 640px) {
      /* Sit lower than centre, so both choices are within easy thumb reach */
      body { align-items: flex-end; justify-content: stretch; }

      .hero {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2.8vh, 26px);
        padding: 64px 20px 28vh;
        font-size: 14vw;
        line-height: 1.05;
      }

      .line.half { display: block; }
      .theme-toggle { top: 14px; right: 14px; width: 42px; height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .go-arrow { animation: none; opacity: 1; }
      .tag.draw .hash line, .tag.loop .hash line, .tag.intro .word { animation: none; stroke-dashoffset: 0; clip-path: none; transform: none; }
      .tag.koda::after { animation: none; transform: scaleX(1); }
      .rings { display: none; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" title="Switch light / dark mode" aria-label="Switch light or dark mode">
    <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="rings" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="hero">
    <span class="line" style="--i: 0"><span class="plain" style="--i: 0">Everything</span></span>
    <span class="line half" style="--i: 1"><span class="plain" style="--i: 1">you want</span></span>
    <span class="line half" style="--i: 2"><span class="plain" style="--i: 2">answered</span></span>
    <span class="line" style="--i: 3"><span class="plain" style="--i: 3">is on&nbsp;</span><a class="tag koda loop intro" href="koda-login.html" aria-label="#Koda" style="--i: 4; --base: 0.75s" data-wipe-light="#faf9f5" data-wipe-dark="#000000"><svg class="hash" viewBox="0 0 100 100" aria-hidden="true"><line pathLength="1" style="--n: 0" x1="40" y1="6" x2="30" y2="94"/><line pathLength="1" style="--n: 1" x1="74" y1="6" x2="64" y2="94"/><line pathLength="1" style="--n: 2" x1="10" y1="33" x2="94" y2="33"/><line pathLength="1" style="--n: 3" x1="6" y1="67" x2="90" y2="67"/></svg><span class="word">Koda</span></a></span>
    <span class="line" style="--i: 4"><a class="tag draw intro" href="login.html" aria-label="#GoWebsite" style="--i: 5; --base: 1.05s" data-wipe-light="#eef2ff" data-wipe-dark="#eef2ff"><svg class="hash" viewBox="0 0 100 100" aria-hidden="true"><line pathLength="1" style="--n: 0" x1="40" y1="6" x2="30" y2="94"/><line pathLength="1" style="--n: 1" x1="74" y1="6" x2="64" y2="94"/><line pathLength="1" style="--n: 2" x1="10" y1="33" x2="94" y2="33"/><line pathLength="1" style="--n: 3" x1="6" y1="67" x2="90" y2="67"/></svg><span class="word">GoWebsite</span><svg class="go-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="18" x2="18" y2="6"/><polyline points="8 6 18 6 18 16"/></svg></a></span>
  </main>

  <script>
    document.getElementById('themeToggle').addEventListener('click', kodaToggleTheme);

    document.querySelectorAll('.tag').forEach(function (tag) {
      // After the intro, hovering #GoWebsite redraws its # (#Koda's # loops on its own)
      setTimeout(function () { tag.classList.remove('intro'); }, 2600);
      tag.addEventListener('mouseenter', function () {
        if (tag.classList.contains('loop') || tag.classList.contains('intro') || document.documentElement.classList.contains('k-leaving')) return;
        tag.classList.remove('draw');
        tag.style.setProperty('--base', '0s');
        void tag.offsetWidth;
        tag.classList.add('draw');
      });

      tag.addEventListener('click', function (e) {
        // Ctrl/Cmd-click or middle-click still opens a new tab normally
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        kodaGo(tag.getAttribute('href'), tag, dark ? tag.dataset.wipeDark : tag.dataset.wipeLight);
      });
    });
  </script>
</body>
</html>
