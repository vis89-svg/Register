      if (v.deduction_percentage != null && (!isNum(v.deduction_percentage) || v.deduction_percentage < 0 || v.deduction_percentage > 100)) return 'Deduction % must be between 0 and 100.';
      if (v.date && !isRealDate(v.date)) return '"' + v.date + '" is not a valid date.';
      return null;
    }

    // The AI must not invent a PAN: it has to appear in what the user typed (or earlier in this chat for follow-ups)
    function panWasTyped(pan, texts) {
      return texts.some(t => String(t || '').toUpperCase().includes(pan));
    }

    function describeRow(e) {
      return `${e.pan_number} | ${e.name || '—'} | ${e.date || 'no date'} | ${money(e.amount)}`;
    }

    // Decide what to do with each new row: add, fill a Quick Entry, skip (duplicate) or error.
    // Used for single entries typed in the chat and for every row of an imported file.
    async function planEntries(input) {
      const rows = input.map(r => ({
        pan: String(r.pan || '').toUpperCase().trim(),
        name: String(r.name || '').trim().replace(/\s+/g, ' '),
        date: r.date || null,
        amount: r.amount ?? null,
        tax_amount: r.tax_amount ?? null,
        deduction_percentage: r.deduction_percentage ?? null,
        parseError: r.parseError || null,
        status: null,
        reason: ''
      }));
      const fail = (r, reason) => { r.status = 'error'; r.reason = reason; };
      const skip = (r, reason) => { r.status = 'skip'; r.reason = reason; };

      rows.forEach(r => {
        if (r.parseError) return fail(r, r.parseError);
        if (!isValidPAN(r.pan)) return fail(r, r.pan ? `"${r.pan}" is not a valid PAN (format ABCDE1234F).` : 'No PAN found.');
        if (r.name.length < 2 || !/[a-z]/i.test(r.name)) return fail(r, r.name ? `"${r.name}" doesn't look like a real name.` : 'Name is missing.');
        const problem = checkValues(r);
        if (problem) return fail(r, problem);
        // Like Full Entry: once amount/tax/deduction is given, a date is required.
        // With only PAN + name it is a Quick Entry (no date, zero amounts).
        r.hasDetails = r.amount != null || r.tax_amount != null || r.deduction_percentage != null || !!r.date;
        if (r.hasDetails && !r.date) return fail(r, 'Date is missing.');
      });

      const pans = [...new Set(rows.filter(r => !r.status).map(r => r.pan))];
      const existing = new Map();
      for (let i = 0; i < pans.length; i += 100) {
        const { data, error } = await supabase
          .from('entries').select('id, pan_number, name, date, amount, created_at')
          .in('pan_number', pans.slice(i, i + 100))
          .order('created_at', { ascending: false });
        if (error) throw new Error('Could not check existing entries: ' + error.message);
        data.forEach(e => {
          if (!existing.has(e.pan_number)) existing.set(e.pan_number, []);
          existing.get(e.pan_number).push(e);
        });
      }

      const seen = new Map();       // PANs met earlier in this batch
      const claimed = new Set();    // Quick Entry rows already being completed
      rows.forEach(r => {
        if (r.status) return;
        const db = existing.get(r.pan) || [];
        const earlier = seen.get(r.pan);

        // One PAN belongs to one person: block a different name on a known PAN
        const knownName = db[0]?.name ?? earlier?.name;
        if (knownName && normName(knownName) !== normName(r.name)) {
          return fail(r, db.length
            ? `PAN ${r.pan} is registered to "${knownName}", not "${r.name}".`
            : `This PAN appears earlier in the file as "${knownName}".`);
        }
        r.name = knownName || r.name;

        const key = r.date + '|' + Number(r.amount || 0);
        if (!r.hasDetails) {
          if (db.length || earlier) return skip(r, `${r.pan} (${r.name}) is already in the register.`);
          r.status = 'add';
        } else if (db.some(e => e.date === r.date && Number(e.amount) === Number(r.amount || 0))) {
          return skip(r, `A ${money(r.amount)} entry dated ${r.date} already exists for ${r.pan}.`);
        } else if (earlier?.keys.has(key)) {
          return skip(r, REPEATED_IN_FILE);
        } else {
          // Like Full Entry: fill in the latest Quick Entry (no date yet) instead of adding a second row
          const skeleton = db.find(e => e.date === null && !claimed.has(e.id));
          if (skeleton) {
            claimed.add(skeleton.id);
            r.status = 'fill';
            r.skeletonId = skeleton.id;
            r.reason = 'Fills in the Quick Entry saved earlier without a date.';
          } else {
            r.status = 'add';
          }
        }
        const entry = earlier || { name: r.name, keys: new Set() };
        if (r.hasDetails) entry.keys.add(key);
        seen.set(r.pan, entry);
      });
      return rows;
    }

    const dbRow = (r) => ({
      pan_number: r.pan, name: r.name, date: r.date || null,
      amount: r.amount || 0, tax_amount: r.tax_amount || 0, deduction_percentage: r.deduction_percentage || 0
    });

    async function commitPlan(rows) {
      const out = { added: 0, filled: 0, failed: [] };
      const toInsert = rows.filter(r => r.status === 'add');
      for (let i = 0; i < toInsert.length; i += 500) {
        const chunk = toInsert.slice(i, i + 500);
        const { error } = await supabase.from('entries').insert(chunk.map(dbRow));
        if (error) chunk.forEach(r => out.failed.push({ row: r, reason: error.message }));
        else out.added += chunk.length;
      }
      for (const r of rows.filter(r => r.status === 'fill')) {
        const { pan_number, name, ...values } = dbRow(r);
        const { error } = await supabase.from('entries').update(values).eq('id', r.skeletonId);
        if (error) out.failed.push({ row: r, reason: error.message });
        else out.filled++;
      }
      return out;
    }

    // Pick which existing entry of a PAN to change; asks the user to be specific when there are several
    function pickRows(rows, a, verb) {
      if (a.entry_date) {
        const matched = rows.filter(e => e.date === a.entry_date);
        if (!matched.length) return { reply: { blocks: [T(`No entry for **${rows[0].pan_number}** is dated ${a.entry_date}. Its entries are:`), entriesTable(rows)] } };
        return { rows: matched };
      }
      if (rows.length > 1) {
        return { reply: { blocks: [T(`**${rows[0].pan_number}** has ${rows.length} entries. Which one should I ${verb}? Tell me the entry's date (for example "the one dated ${rows[0].date || '2024-04-10'}"), or say "all of them".`), entriesTable(rows)] } };
      }
      return { rows };
    }

    // ---- Run an action and build the reply ----
    async function executeAction(a, ctx = { text: '', earlier: [] }) {
      const pan = a.pan ? String(a.pan).toUpperCase().trim() : null;

      switch (a.action) {
        case 'insert': {
          if (!pan || !a.name) return say('To add an entry I need both a **PAN** and a **name**, for example: "Enter PAN ABCDE1234F for John Doe on 2024-01-15 with amount 5000".');
          if (!panWasTyped(pan, [ctx.text])) return say(`**Not saved.** Please type the PAN (${pan}) exactly in your message, so nothing is entered by mistake.`);
          const [p] = await planEntries([{
            pan, name: a.name, date: a.date || null,
            amount: a.amount ?? null, tax_amount: a.tax_amount ?? null, deduction_percentage: a.deduction_percentage ?? null
          }]);
          if (p.status === 'error') {
            const hint = /registered to "(.+)"/.exec(p.reason);
            return say('**Not saved.** ' + p.reason + (hint ? ` Check the PAN, or send it again using the name "${hint[1]}".` : p.reason === 'Date is missing.' ? ' Add the date (for example "on 2024-04-10") and send it again.' : ''));
          }
          if (p.status === 'skip') return say(p.reason + ' Nothing new was added.');
          const result = await commitPlan([p]);
          if (result.failed.length) return say('**Not saved.** ' + result.failed[0].reason);
          return {
            blocks: [
              T(p.status === 'fill' ? `Done. I completed the Quick Entry for **${p.name}** that was saved earlier without a date.` : `Done. I saved a new entry for **${p.name}**.`),
              entriesTable([dbRow(p)])
            ]
          };
        }

        case 'search': {
          const q = normalizeQuery(a);
          const shown = Math.min(q.limit || MAX_ROWS, MAX_ROWS);
          let query = applyConds(supabase.from('entries').select('*', { count: 'exact' }), q.conds);
          query = q.sort && q.sort.field ? orderQuery(query, q) : query.order('created_at', { ascending: false });
          const { data, error, count } = await query.limit(shown);
          if (error) return say('I couldn\'t load the entries: ' + error.message);
          const blocks = [];
          if (!data.length) {
            blocks.push(T('I didn\'t find any entries that match.'), filterBlock(q));
          } else {
            const total = q.limit ? Math.min(count ?? data.length, q.limit) : (count ?? data.length);
            blocks.push(
              T(`I found **${plural(total)}**${total > data.length ? ` (showing the first ${data.length})` : ''}.`),
              filterBlock(q),
              entriesTable(data, total > data.length ? 'Ask for an Excel or PDF file to get the full list.' : '')
            );
          }
          if (nothingApplied(q, ctx.text)) blocks.push({ type: 'note', text: 'I couldn\'t turn part of your question into a filter, so this is everything. Try saying it another way, for example "deduction exactly 2%".' });
          return { blocks };
        }

        case 'summary': {
          const q = normalizeQuery(a);
          const rows = await fetchAllEntries(q.sort && q.sort.measure ? { ...q, limit: null } : q);
          if (!rows.length) return { blocks: [T('There are no matching entries to total.'), filterBlock(q)] };
          const result = summarize(rows, a, q);
          const blocks = [
            T(result.type === 'table' ? `Here it is by **${GROUPS[a.group_by].label.toLowerCase()}**:` : 'Here are the totals:'),
            filterBlock(q),
            result
          ];
          if (nothingApplied(q, ctx.text)) blocks.push({ type: 'note', text: 'I couldn\'t turn part of your question into a filter, so these totals cover everything.' });
          return { blocks };
        }

        case 'update': {
          if (!pan || !isValidPAN(pan)) return say('Which PAN should I update? Please give a valid PAN (for example ABCDE1234F).');
          if (!panWasTyped(pan, [ctx.text, ...ctx.earlier])) return say(`**Not changed.** Please type the PAN (${pan}) in your message.`);
          const changes = {};
          if (isNum(a.amount)) changes.amount = a.amount;
          if (isNum(a.tax_amount)) changes.tax_amount = a.tax_amount;
          if (isNum(a.deduction_percentage)) changes.deduction_percentage = a.deduction_percentage;
          if (a.date) changes.date = a.date;
          const newName = a.name ? String(a.name).trim().replace(/\s+/g, ' ') : null;
          if (!Object.keys(changes).length && !newName) return say(`What should I change for **${pan}**? For example "set amount to 7500".`);
          const problem = checkValues(changes);
          if (problem) return say('**Not changed.** ' + problem);

          const { data: rows, error: lookupError } = await supabase
            .from('entries').select('*').eq('pan_number', pan).order('date', { ascending: true });
          if (lookupError) return say('I couldn\'t load the entries: ' + lookupError.message);
          if (!rows.length) return say(`There are no entries with PAN **${pan}**.`);

          const done = [];
          // A name belongs to the PAN, so a name change applies to all of its entries
          if (newName && normName(newName) !== normName(rows[0].name)) {
            if (newName.length < 2 || !/[a-z]/i.test(newName)) return say(`**Not changed.** "${newName}" doesn't look like a real name.`);
            const { error } = await supabase.from('entries').update({ name: newName }).eq('pan_number', pan);
            if (error) return say('**Not changed.** ' + error.message);
            done.push(`changed the name to **${newName}** on all ${plural(rows.length)}`);
          }

          let changed = [];
          if (Object.keys(changes).length) {
            const picked = a.all_entries ? { rows } : pickRows(rows, a, 'change');
            if (picked.reply) {
              if (done.length) picked.reply.blocks.unshift(T('I ' + done.join(' and ') + '.'));
              return picked.reply;
            }
            for (const target of picked.rows) {
              const after = { ...target, ...changes };
              const clash = rows.find(e => e.id !== target.id && e.date === after.date && Number(e.amount) === Number(after.amount));
              if (clash) return say((done.length ? 'I ' + done.join(' and ') + ', but ' : '**Not changed:** ') + `that change would duplicate another entry (${describeRow(clash)}).`);
            }
            const { data, error } = await supabase.from('entries').update(changes).in('id', picked.rows.map(e => e.id)).select('*');
            if (error) return say('**Not changed.** ' + error.message);
            changed = data || [];
            done.push('updated ' + Object.entries(changes).map(([k, v]) => k.replace(/_percentage/, ' %').replace(/_/g, ' ') + ' to ' + (k === 'date' ? v : k.includes('percentage') ? v + '%' : money(v))).join(', ') + ' on ' + plural(picked.rows.length));
          }

          if (!done.length) return say(`Nothing to change: **${pan}** already has those values.`);
          const blocks = [T('Done. I ' + done.join(' and ') + '.')];
          if (changed.length) blocks.push(entriesTable(changed));
          return { blocks };
        }

        case 'delete': {
          if (!pan || !isValidPAN(pan)) return say('Which PAN should I delete? Please give a valid PAN (for example ABCDE1234F).');
          if (!panWasTyped(pan, [ctx.text, ...ctx.earlier])) return say(`**Not deleted.** Please type the PAN (${pan}) in your message.`);
          const { data: rows, error: lookupError } = await supabase
            .from('entries').select('*').eq('pan_number', pan).order('date', { ascending: true });
          if (lookupError) return say('I couldn\'t load the entries: ' + lookupError.message);
          if (!rows.length) return say(`There are no entries with PAN **${pan}**.`);
          const picked = a.all_entries ? { rows } : pickRows(rows, a, 'delete');
          if (picked.reply) return picked.reply;
          if (!confirm('Delete ' + plural(picked.rows.length) + ':\n\n' + picked.rows.map(describeRow).join('\n') + '\n\nThis cannot be undone.')) return say('Okay, I didn\'t delete anything.');
          const { data, error } = await supabase.from('entries').delete().in('id', picked.rows.map(e => e.id)).select('id');
          if (error) return say('**Not deleted.** ' + error.message);
          return { blocks: [T(`Done. I deleted ${plural(data.length)} for **${pan}**.`), entriesTable(picked.rows)] };
        }

        case 'dedupe': {
          const q = normalizeQuery(a);
          const dupes = findRegisterDuplicates(await fetchAllEntries({ ...q, sort: null, limit: null }));
          if (!dupes.length) return { blocks: [T('I didn\'t find any duplicate entries, so nothing needs removing.'), filterBlock(q)] };
          const request = { where: a.where, pan: a.pan, pan_prefix: a.pan_prefix, name: a.name };
          return {
            blocks: [
              T(`I found **${plural(dupes.length)}** that ${dupes.length === 1 ? 'is an exact repeat' : 'are exact repeats'} of another entry (same PAN, name, amount and date). The first copy of each stays; these extra copies can be removed. Nothing is deleted until you press the button.`),
              filterBlock(q),
              { type: 'dedupe', request, rows: dupes.map(e => ({ id: e.id, pan_number: e.pan_number, name: e.name, date: e.date, amount: e.amount, tax_amount: e.tax_amount })), done: null }
            ]
          };
        }

        case 'export': {
          const request = { ...a, format: a.format === 'pdf' ? 'pdf' : 'excel' };
          delete request.reply;
          const result = await exportEntries(request);
          if (typeof result === 'string') return say(result);
          return {
            blocks: [
              T(`Here's your ${request.format === 'pdf' ? 'PDF' : 'Excel file'} with ${plural(result.count)}. It should be in your downloads already. Total amount ${money(result.totalAmount)}, total tax ${money(result.totalTax)}.`),
              filterBlock(normalizeQuery(request)),
              { type: 'file', fileName: result.fileName, format: request.format, count: result.count, request }
            ]
          };
        }

        default: {
          if (a.reply) return say(a.reply);
          // The AI chose "just chat" but gave no reply text
          const greeting = /^\s*(hi|hello|hey|hii+|namaste|good\s+(morning|afternoon|evening|night)|thanks|thank\s+you)\b/i.test(ctx.text);
          return say((greeting ? 'Hello! ' : 'I\'m not sure what you\'d like me to do. ') +
            'I can add, find, total, update, delete and export PAN entries, or import an Excel, CSV, PDF or Word file with the paperclip. For example: "Show me all entries" or "Enter PAN ABCDE1234F for John Doe on 2024-01-15 with amount 5000".');
        }
      }
    }

    // ---- Reading attached files (Excel, CSV, PDF, Word, text) ----
    function isoDate(y, m, d) {
      if (y < 100) y += 2000;
      const s = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      return isRealDate(s) ? s : null;
    }

    const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    const monthNum = (name) => MONTHS.indexOf(String(name).slice(0, 3).toLowerCase()) + 1;

    // Accepts Excel dates, 2024-04-10, 10/04/2024 (day first, as used in India), 10-Apr-2024, Apr 10, 2024
    function normDate(v) {
      if (v instanceof Date) {
        if (isNaN(v)) return null;
        const d = new Date(v.getTime() + 12 * 3600 * 1000); // Excel dates can be a few seconds before midnight
        return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
      }
      const s = String(v ?? '').trim().replace(/[T\s]\d{1,2}:\d{2}(:\d{2})?.*$/, '');
      let m;
      if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return isoDate(+m[1], +m[2], +m[3]);
      if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2}|\d{4})$/))) return isoDate(+m[3], +m[2], +m[1]);
      if ((m = s.match(/^(\d{1,2})[\s-]+([a-z]{3,9})\.?[\s-,]+(\d{2}|\d{4})$/i)) && monthNum(m[2])) return isoDate(+m[3], monthNum(m[2]), +m[1]);
      if ((m = s.match(/^([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/i)) && monthNum(m[1])) return isoDate(+m[3], monthNum(m[1]), +m[2]);
      return null;
    }

    // Number from "₹ 25,000.00", "Rs. 2,500", "10%"; null when empty; the original text when it isn't a number
    function parseNum(v) {
      if (typeof v === 'number') return v;
      const raw = String(v ?? '').trim();
      if (!raw) return null;
      const s = raw.replace(/₹|rs\.?|inr|,|\s|%/gi, '');
      return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : raw;
    }

    // Split a line of text into cells; keeps multi-word names together
    function splitLine(line) {
      const s = String(line).replace(/\b(\d{1,2})[\s-]([A-Za-z]{3,9})[\s-,]+(\d{4})\b/g, (all, d, mo, y) => normDate(`${d} ${mo} ${y}`) || all);
      if (/\t/.test(s)) return s.split('\t');
      if (/\|/.test(s)) return s.split('|');
      if (/\s{2,}/.test(s.trim())) return s.trim().split(/\s{2,}/);
      if (/,\s*[A-Za-z]/.test(s) && s.split(',').length >= 3) return s.split(/,(?!\d{2,3}(?:\D|$))/);
      const out = [];
      let words = [];
      s.trim().split(/\s+/).forEach(tok => {
        const isWord = /^[A-Za-z&.'()/-]+$/.test(tok) && !/^rs\.?$/i.test(tok);
        if (isWord) { words.push(tok); return; }
        if (words.length) { out.push(words.join(' ')); words = []; }
        if (!/^rs\.?$/i.test(tok)) out.push(tok);
      });
      if (words.length) out.push(words.join(' '));
      return out;
    }

    // Guess the fields of a row from its cells when there is no header row
    function rowFromCells(rawCells, line) {
      let cells = rawCells.map(c => c instanceof Date ? normDate(c) : String(c ?? '')).map(s => s.trim()).filter(Boolean);
      if (cells.length === 1) cells = splitLine(cells[0]).map(s => s.trim()).filter(Boolean);
      const pans = line.toUpperCase().match(new RegExp(PAN_RE.source, 'g')) || [];
      const r = { pan: pans[0] || '', name: '', date: null, amount: null, tax_amount: null, deduction_percentage: null, line };
      if (pans.length !== 1) return { ...r, unclear: true };

      const nums = [];
      const texts = [];
      cells.forEach((c, i) => {
        const rest = c.toUpperCase().includes(r.pan) ? c.replace(new RegExp(r.pan, 'i'), '').trim() : c;
        if (!rest) return;
        const d = normDate(rest);
        if (d && !r.date) { r.date = d; return; }
        const n = parseNum(rest);
        if (typeof n === 'number' && /%$/.test(rest)) { r.deduction_percentage = n; return; }
        if (typeof n === 'number') { nums.push({ n, i, int: /^\d+$/.test(rest) }); return; }
        if (/[a-z]/i.test(rest) && !/^(rs\.?|inr|total|sl\.?\s*no\.?)$/i.test(rest)) texts.push(rest);
      });
      // A whole number in the first column is the serial number (Sl.No)
      if (nums.length > 1 && nums[0].i === 0 && nums[0].int) nums.shift();
      r.amount = nums[0] ? nums[0].n : null;
      r.tax_amount = nums[1] ? nums[1].n : null;
      if (r.deduction_percentage == null && nums[2]) r.deduction_percentage = nums[2].n;
      r.name = texts.sort((a, b) => b.length - a.length)[0] || '';
      const odd = /\d|[()@:;#]|\b(pan|rs|inr|tds|tax|amount|received|paid|dated?|sum|from|payment)\b/i.test(r.name) || r.name.split(/\s+/).length > 6;
      r.unclear = !r.name || odd || nums.length > 3 || texts.length > 2;
      return r;
    }

    // Recognise a header row like "PAN Number | Organization / Name | Amount | Tax | Deduction | Date"
    function headerMap(cells) {
      const map = {};
      cells.forEach((c, i) => {
        const h = String(c).toLowerCase();
        if (!h) return;
        if (/\bpan\b/.test(h)) map.pan ??= i;
        else if (/deduct|%|percent/.test(h)) map.ded ??= i;
        else if (/\btax\b|tds/.test(h)) map.tax ??= i;
        else if (/amount|amt|value|paid|gross/.test(h)) map.amount ??= i;
        else if (/date/.test(h)) map.date ??= i;
        else if (/name|organi[sz]ation|party|deductee|payee|company/.test(h)) map.name ??= i;
      });
      return map.pan != null ? map : null;
    }

    function rowsFromGrid(grid) {
      const out = [];
      let map = null;
      // Read one row using the header's column positions
      const fromHeader = (cells, line, pan) => {
        const get = (k) => map[k] != null ? cells[map[k]] : '';
        const rawDate = get('date');
        return {
          pan,
          name: String(get('name')).trim(),
          date: rawDate === '' ? null : (normDate(rawDate) || String(rawDate)),
          amount: parseNum(get('amount')),
          tax_amount: parseNum(get('tax')),
          deduction_percentage: parseNum(get('ded')),
          line
        };
      };
      grid.forEach(rawRow => {
        const cells = (rawRow || []).map(c => c instanceof Date ? c : String(c ?? '').trim());
        if (!cells.some(c => c !== '')) return;
        const line = cells.map(c => c instanceof Date ? normDate(c) : c).filter(Boolean).join(' | ');
        if (!PAN_RE.test(line.toUpperCase())) {
          // A mistyped PAN under a PAN column is shown as a problem row instead of being dropped
          const badPan = map && map.name != null && String(cells[map.pan] ?? '').trim();
          if (badPan && /^[A-Z0-9]{6,14}$/i.test(badPan) && String(cells[map.name] ?? '').trim()) {
            out.push(fromHeader(cells, line, badPan.toUpperCase()));
            return;
          }
          map = headerMap(cells) || map;   // header, title or totals row
          return;
        }
        if (map && map.name != null) {
          const panCell = String(cells[map.pan] ?? '').toUpperCase().match(PAN_RE);
          out.push(fromHeader(cells, line, panCell ? panCell[1] : (line.toUpperCase().match(PAN_RE) || [])[1]));
        } else {
          out.push(rowFromCells(cells, line));
        }
      });
      return out;
    }

    async function pdfToGrid(file, onStatus) {
      await loadScript(PDFJS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const grid = [];
      let anyText = false;
      for (let p = 1; p <= pdf.numPages; p++) {
        onStatus(`Reading page ${p} of ${pdf.numPages}…`);
        const content = await (await pdf.getPage(p)).getTextContent();
        const lines = [];
        content.items.forEach(it => {
          if (!it.str || !it.str.trim()) return;
          anyText = true;
          const x = it.transform[4];
          const y = it.transform[5];
          let line = lines.find(l => Math.abs(l.y - y) < 3);
          if (!line) lines.push(line = { y, items: [] });
          line.items.push({ x, end: x + it.width, size: Math.abs(it.transform[0]) || 10, str: it.str });
        });
        lines.sort((a, b) => b.y - a.y).forEach(l => {
          l.items.sort((a, b) => a.x - b.x);
          // Text pieces close together belong to the same cell
          const cells = [];
          let prev = null;
          l.items.forEach(it => {
            const gap = prev ? it.x - prev.end : Infinity;
            if (prev && gap < it.size * 0.15) cells[cells.length - 1] += it.str;
            else if (prev && gap < it.size * 0.6) cells[cells.length - 1] += ' ' + it.str;
            else cells.push(it.str);
            prev = it;
          });
          grid.push(cells);
        });
      }
      if (!anyText) throw new Error('This PDF has no readable text (it may be a scan or a photo). Please attach the Excel or CSV version instead.');
      return grid;
    }

    async function docxToGrids(file) {
      await loadScript(MAMMOTH_URL);
      const { value: html } = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const grids = [];
      doc.querySelectorAll('table').forEach(t => {
        grids.push([...t.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.textContent.trim())));
        t.remove();
      });
      const lines = [...doc.body.querySelectorAll('p, li')].map(p => p.textContent.trim()).filter(Boolean);
      if (lines.length) grids.push(lines.map(splitLine));
      return grids;
    }

    async function readFileRows(file, onStatus) {
      const ext = fileExt(file.name);
      const grids = [];
      if (['xlsx', 'xls', 'csv'].includes(ext)) {
        await loadScript(XLSX_URL);
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
        wb.SheetNames.forEach(n => grids.push(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' })));
      } else if (ext === 'pdf') {
        grids.push(await pdfToGrid(file, onStatus));
      } else if (ext === 'docx') {
        grids.push(...await docxToGrids(file));
      } else if (ext === 'txt') {
        grids.push((await file.text()).split(/\r?\n/).map(splitLine));
      } else if (ext === 'doc') {
        throw new Error('Old Word (.doc) files can\'t be read. Open it in Word, save it as .docx, and attach it again.');
      } else {
        throw new Error('I can read Excel (.xlsx, .xls), CSV, PDF, Word (.docx) and text files.');
      }
      return grids.flatMap(rowsFromGrid);
    }

    // Lines the browser couldn't make sense of go to the AI, in small batches.
    // Everything the AI returns is checked against the original line, so it can't invent values.
    async function aiReadLines(rows, onStatus) {
      const prompt = `Each numbered line comes from a document listing PAN register entries. Return JSON {"rows":[{"line":<number>,"pan":"","name":"","date":"YYYY-MM-DD","amount":0,"tax_amount":0,"deduction_percentage":0}]}.
Copy values exactly from the line and leave out any field that isn't on it. Dates like 10/04/2024 are day/month/year. Skip lines that are not entries. Never invent anything.`;
      for (let i = 0; i < rows.length; i += 12) {
        const batch = rows.slice(i, i + 12);
        onStatus(`Using the AI to read ${plural(rows.length, 'unclear line')}…`);
        let got = [];
        try {
          const json = await askGroqJSON([
            { role: 'system', content: prompt },
            { role: 'user', content: batch.map((r, k) => `${k + 1}: ${r.line}`).join('\n') }
          ], 900, onStatus);
          got = Array.isArray(json.rows) ? json.rows : [];
        } catch (e) {
          batch.forEach(r => { r.parseError = 'Couldn\'t read this line automatically (the AI is busy). Please check it.'; });
          continue;
        }
        batch.forEach((r, k) => {
          const g = got.find(x => Number(x.line) === k + 1);
          if (!g) { r.parseError = 'Couldn\'t read this line: ' + r.line.slice(0, 80); return; }
          const pan = String(g.pan || '').toUpperCase();
          const name = String(g.name || '').trim();
          const lineNums = (r.line.match(/\d[\d,]*(\.\d+)?/g) || []).map(s => Number(s.replace(/,/g, '')));
          const onLine = (v) => v == null || v === '' || lineNums.some(n => Math.abs(n - Number(v)) < 0.005);
          if (!isValidPAN(pan) || !r.line.toUpperCase().includes(pan)) { r.parseError = 'Couldn\'t find a valid PAN on this line.'; return; }
          if (!name || !normName(r.line).includes(normName(name))) { r.parseError = 'Couldn\'t find the name on this line.'; return; }
          if (!onLine(g.amount) || !onLine(g.tax_amount) || !onLine(g.deduction_percentage)) { r.parseError = 'The numbers on this line are unclear.'; return; }
          Object.assign(r, {
            pan, name, date: g.date || null,
            amount: g.amount ?? null, tax_amount: g.tax_amount ?? null, deduction_percentage: g.deduction_percentage ?? null,
            unclear: false
          });
        });
      }
    }

    // Words sent with a file: "analyse" -> summary only, "remove duplicates" -> cleaned file, anything else -> import preview
    function fileIntent(text) {
      const t = String(text || '');
      const analyse = /analy[sz]|summar|overview|stat(s|istic)|insight|review|tell me about|what('?s| is) in|look (at|through)|check (it|this|the file)/i.test(t);
      const clean = /dedup|de-dup|(remove|delete|drop|clean|get rid of|strip|take out)\b.*\b(dup|double|repeat|same|copies)|(dup\w*|doubles?|repeat\w*|copies)\b.*\b(remove|delete|drop|clean|out)|clean (it|this|the file|up)/i.test(t);
      return { analyse, clean };
    }

    async function handleFile(file, text, onStatus) {
      const intent = fileIntent(text);
      const rows = await readFileRows(file, onStatus);
      if (!rows.length) return say(`I couldn't find any PAN entries in **${file.name}**. Each row needs a PAN (like ABCDE1234F) and a name.`);
      if (rows.length > MAX_IMPORT_ROWS) return say(`**${file.name}** has ${rows.length} rows. Please split it into files of up to ${MAX_IMPORT_ROWS} rows.`);

      const unclear = rows.filter(r => r.unclear);
      if (unclear.length) await aiReadLines(unclear, onStatus);

      onStatus('Checking for duplicates…');
      const plan = await planEntries(rows);
      if (intent.analyse || intent.clean) {
        const blocks = [];
        if (intent.analyse) blocks.push(...analyseFile(file.name, rows, plan));
        if (intent.clean) blocks.push(...cleanFile(file.name, rows, plan));
        blocks.push({ type: 'note', text: 'Nothing was saved to your register. To add the new rows, attach the file again and send it on its own (or say "import").' });
        return { blocks };
      }
      const block = {
        type: 'import',
        fileName: file.name,
        rows: plan.map(r => ({ pan: r.pan, name: r.name, date: r.date, amount: r.amount, tax_amount: r.tax_amount, deduction_percentage: r.deduction_percentage, parseError: r.parseError, status: r.status, reason: r.reason })),
        done: null
      };
      const ready = plan.filter(r => r.status === 'add' || r.status === 'fill').length;
      let message = `I read **${file.name}** and found **${plural(rows.length, 'row')}**.`;
      if (unclear.length) message += ` ${plural(unclear.length, 'line')} had an unusual layout, so the AI helped read ${unclear.length === 1 ? 'it' : 'them'}. Please double-check ${unclear.length === 1 ? 'that row' : 'those rows'}.`;
      message += ready ? ' Nothing is saved yet. Review the rows below, then press **Add** to save the new ones.' : '';
      return { blocks: [T(message), block] };
    }

    // Same rule as the register's duplicates: same PAN, date and amount (or a repeated PAN-and-name-only row)
    const fileRowKey = (r) => r.pan + '|' + (r.date || '') + '|' + (isNum(r.amount) ? r.amount : 0);

    function analyseFile(fileName, rows, plan) {
      const count = (fn) => plan.filter(fn).length;
      const repeated = count(r => r.status === 'skip' && r.reason === REPEATED_IN_FILE);
      const inRegister = count(r => r.status === 'skip') - repeated;
      const problems = count(r => r.status === 'error');
      const fresh = count(r => r.status === 'add' || r.status === 'fill');
      const dates = rows.map(r => r.date).filter(d => d && isRealDate(d)).sort();
      const pans = new Map();
      plan.forEach(r => { if (isValidPAN(r.pan)) { const p = pans.get(r.pan) || { name: r.name, n: 0 }; p.n++; pans.set(r.pan, p); } });
      const numbers = (k) => rows.reduce((sum, r) => sum + (isNum(r[k]) ? r[k] : 0), 0);

      const blocks = [
        T(`Here's what's in **${fileName}**: **${plural(rows.length, 'row')}** for **${plural(pans.size, 'PAN')}**` +
          (dates.length ? `, dated ${dates[0]} to ${dates[dates.length - 1]}` : '') + '.'),
        { type: 'stats', items: [
          { label: 'Rows', value: rows.length.toLocaleString('en-IN') },
          { label: 'Total amount', value: money(numbers('amount')) },
          { label: 'Total tax', value: money(numbers('tax_amount')) },
          { label: 'New for your register', value: fresh.toLocaleString('en-IN') }
        ] },
        T([
          `• **${fresh}** new` + (count(r => r.status === 'fill') ? ` (${count(r => r.status === 'fill')} complete a Quick Entry)` : ''),
          `• **${inRegister}** already in your register`,
          `• **${repeated}** repeated within the file`,
          `• **${problems}** with problems`
        ].join('\n'))
      ];

      const multi = [...pans.entries()].filter(([, p]) => p.n > 1).sort((x, y) => y[1].n - x[1].n).slice(0, 5);
      if (multi.length) {
        blocks.push(T('PANs that appear more than once:'), {
          type: 'table',
          columns: [{ label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Rows', num: true }],
          rows: multi.map(([pan, p]) => [pan, p.name, String(p.n)])
        });
      }

      const issues = plan.map((r, i) => ({ r, i })).filter(({ r }) => r.status === 'skip' || r.status === 'error');
      if (issues.length) {
        blocks.push(T('Rows that need attention:'), {
          type: 'table',
          columns: [{ label: 'Row', num: true }, { label: 'Status' }, { label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Date' }, { label: 'Amount', num: true }],
          rows: issues.slice(0, 50).map(({ r, i }) => [String(i + 1), { pill: r.status, text: statusLabel(r), reason: r.reason }, r.pan, r.name, r.date || '', isNum(r.amount) ? money(r.amount) : (r.amount ?? '')]),
          note: issues.length > 50 ? `Showing the first 50 of ${issues.length}.` : ''
        });
      }
      return blocks;
    }

    // Remove rows repeated within the file; keeps the first copy and every other row (problem rows included)
    function cleanFile(fileName, rows, plan) {
      const seen = new Set();
      const kept = [];
      const removed = [];
      rows.forEach((r, i) => {
        const pan = String(plan[i].pan || '').toUpperCase();
        const key = isValidPAN(pan) ? fileRowKey({ ...r, pan }) : null;
        if (key && seen.has(key)) removed.push({ r, i, pan });
        else { if (key) seen.add(key); kept.push({ r, pan }); }
      });
      if (!removed.length) return [T(`I didn't find any repeated rows in **${fileName}**, so there's nothing to remove.`)];

      const cleanName = fileName.replace(/\.[^.]+$/, '') + '_cleaned.xlsx';
      const cleanRows = kept.map(({ r, pan }) => ({
        pan_number: pan, name: String(r.name || '').trim(), date: r.date || '',
        amount: isNum(r.amount) ? r.amount : 0, tax_amount: isNum(r.tax_amount) ? r.tax_amount : 0,
        deduction_percentage: isNum(r.deduction_percentage) ? r.deduction_percentage : 0
      }));
      const inRegister = plan.filter(r => r.status === 'skip' && r.reason !== REPEATED_IN_FILE).length;
      return [
        T(`I removed **${plural(removed.length, 'repeated row')}** from **${fileName}**. The cleaned file has **${plural(cleanRows.length, 'row')}**.` +
          (inRegister ? ` ${plural(inRegister, 'row')} ${inRegister === 1 ? 'is' : 'are'} already in your register; I kept ${inRegister === 1 ? 'it' : 'them'} in the file, and ${inRegister === 1 ? 'it' : 'they'} will be skipped if you import it.` : '')),
        { type: 'file', fileName: cleanName, format: 'excel', rows: cleanRows },
        T('Rows I removed:'),
        {
          type: 'table',
          columns: [{ label: 'Row', num: true }, { label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Date' }, { label: 'Amount', num: true }],
          rows: removed.slice(0, 50).map(({ r, i, pan }) => [String(i + 1), pan, r.name, r.date || '', isNum(r.amount) ? money(r.amount) : '']),
          note: removed.length > 50 ? `Showing the first 50 of ${removed.length}.` : ''
        }
      ];
    }

    // ---- Duplicates already in the register ----
    // Same rule as the Display page: same PAN, name, amount and date. The oldest copy stays.
    function findRegisterDuplicates(rows) {
      const seen = new Set();
      return [...rows]
        .sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || '')))
        .filter(e => {
          const key = e.pan_number + '|' + normName(e.name) + '|' + Number(e.amount) + '|' + (e.date || '');
          if (seen.has(key)) return true;
          seen.add(key);
          return false;
        });
    }

    function renderDedupe(b, msg) {
      const box = el('div');
      box.style.display = 'grid';
      box.style.gridTemplateColumns = 'minmax(0, 1fr)';
      box.style.gap = '12px';
      box.appendChild(renderTable({
        columns: [{ label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Date' }, { label: 'Amount', num: true }, { label: 'Tax', num: true }],
        rows: b.rows.slice(0, 200).map(e => [e.pan_number, e.name || '', e.date || '', money(e.amount), money(e.tax_amount)]),
        note: b.rows.length > 200 ? `Showing the first 200 of ${b.rows.length}.` : ''
      }));
      const footer = el('div', 'q-import-footer');
      if (b.done) {
        const done = el('span', 'q-pill done');
        done.append(icon('check', 12), document.createTextNode(b.done.removed ? `Removed ${plural(b.done.removed)}` : 'Nothing needed removing'));
        footer.appendChild(done);
      } else {
        const btn = el('button', 'q-btn primary', `Remove ${plural(b.rows.length, 'duplicate')}`);
        btn.type = 'button';
        btn.addEventListener('click', () => commitDedupe(b, msg, btn));
        footer.append(btn, el('span', null, 'The first copy of each entry stays.'));
      }
      box.appendChild(footer);
      return box;
    }

    async function commitDedupe(block, msg, btn) {
      if (busy) return;
      const n = block.rows.length;
      if (!confirm(`Delete ${n} duplicate ${n === 1 ? 'entry' : 'entries'}? The first copy of each stays. This cannot be undone.`)) return;
      busy = true;
      updateSendState();
      btn.disabled = true;
      btn.textContent = 'Removing…';
      try {
        // Check again right before deleting, and only delete rows that are still extra copies
        const fresh = findRegisterDuplicates(await fetchAllEntries({ ...normalizeQuery(block.request || {}), sort: null, limit: null }));
        const ids = fresh.map(e => e.id).filter(id => block.rows.some(r => r.id === id));
        let removed = 0;
        for (let i = 0; i < ids.length; i += 200) {
          const { data, error } = await supabase.from('entries').delete().in('id', ids.slice(i, i + 200)).select('id');
          if (error) throw new Error(error.message);
          removed += data.length;
        }
        block.done = { removed };
      } catch (err) {
        alert('Removing duplicates failed: ' + err.message);
      }
      saveChats();
      const node = btn.closest('.q-msg');
      if (node) node.replaceWith(renderMessage(msg));
      busy = false;
      updateSendState();
    }

    async function commitImport(block, msg, btn) {
      if (busy) return;
      busy = true;
      updateSendState();
      btn.disabled = true;
      btn.textContent = 'Adding…';
      try {
        // Check again right before saving, in case entries were added since the preview
        const plan = await planEntries(block.rows);
        const result = await commitPlan(plan);
        result.failed.forEach(f => { f.row.status = 'error'; f.row.reason = 'Not saved: ' + f.reason; });
        block.rows = plan.map(r => ({ pan: r.pan, name: r.name, date: r.date, amount: r.amount, tax_amount: r.tax_amount, deduction_percentage: r.deduction_percentage, parseError: r.parseError, status: r.status, reason: r.reason }));
        block.done = { added: result.added, filled: result.filled, failed: result.failed.length };
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
      saveChats();
      const node = btn.closest('.q-msg');
      if (node) node.replaceWith(renderMessage(msg));
      busy = false;
      updateSendState();
    }

    // ---- Sending ----
    async function handleText(text, history, onStatus) {
      let action;
      let note = null;
      try {
        action = await askAI(text, history, onStatus);
      } catch (aiError) {
        console.warn('AI unavailable, using local parser:', aiError);
        action = parseLocally(text);
        note = 'The AI is busy right now, so the basic parser handled this message.';
      }
      onStatus('Working…');
      const result = await executeAction(action, { text, earlier: history.map(messageText) });
      if (note) result.blocks.push({ type: 'note', text: note });
      result.action = Object.fromEntries(Object.entries(action).filter(([k, v]) => v !== null && v !== undefined && k !== 'reply'));
      return result;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = pendingFile;
      if ((!text && !file) || busy) return;
      busy = true;

      // The first message of a new chat creates it in the sidebar
      let chat = getChat(activeId);
      if (!chat) {
        const titleSource = text || file.name;
        chat = { id: newId(), title: titleSource.length > 40 ? titleSource.slice(0, 40) + '…' : titleSource, updatedAt: Date.now(), messages: [] };
        chats.unshift(chat);
        activeId = chat.id;
      }
      const history = chat.messages.slice();
      const userMsg = { role: 'user', text, files: file ? [{ name: file.name, size: file.size }] : [] };
      chat.messages.push(userMsg);
      saveChats();
      renderChatList();
      setEmptyState();

      messageInput.value = '';
      autosize();
      clearAttachment();
      appendMessage(userMsg);
      await respond(chat, text, file, history);
    }

    // Ask Koda for a reply to the last message in this chat and add it below
    async function respond(chat, text, file, history) {
      busy = true;
      updateSendState();
      const thinking = appendThinking(file ? 'Reading ' + file.name + '…' : 'Thinking…');
      const onStatus = (s) => thinking.setStatus(s);

      let reply;
      try {
        reply = file ? await handleFile(file, text, onStatus) : await handleText(text, history, onStatus);
      } catch (err) {
        reply = say('Sorry, something went wrong: ' + err.message);
      }

      const saved = { role: 'assistant', blocks: reply.blocks };
      if (reply.action) saved.action = reply.action;
      // Save the reply even if the user switched to another chat meanwhile
      chat.messages.push(saved);
      chat.updatedAt = Date.now();
      chats = [chat, ...chats.filter(c => c.id !== chat.id)];
      saveChats();
      renderChatList();
      if (thinking.isConnected) {
        thinking.replaceWith(renderMessage(saved));
        scrollToBottom();
      } else if (activeId === chat.id) {
        appendMessage(saved);
      }

      busy = false;
      updateSendState();
      messageInput.focus();
    }

    // ---- Composer ----
    function autosize() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 220) + 'px';
    }

    function updateSendState() {
      sendBtn.disabled = busy || (!messageInput.value.trim() && !pendingFile);
    }

    function setAttachment(file) {
      if (!file) return;
      if (file.size > MAX_FILE_MB * 1024 * 1024) {
        alert(`"${file.name}" is larger than ${MAX_FILE_MB} MB.`);
        return;
      }
      pendingFile = file;
      attachments.textContent = '';
      const card = fileCard(file.name, fileExt(file.name).toUpperCase() + ' · ' + formatSize(file.size), true);
      const remove = el('button', 'q-remove');
      remove.type = 'button';
      remove.title = 'Remove';
      remove.appendChild(icon('x', 12));
      remove.addEventListener('click', () => { clearAttachment(); updateSendState(); });
      card.appendChild(remove);
      attachments.appendChild(card);
      updateSendState();
      messageInput.focus();
    }

    function clearAttachment() {
      pendingFile = null;
      attachments.textContent = '';
      fileInput.value = '';
    }

    messageForm.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener('input', () => { autosize(); updateSendState(); });

    $('attachBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => setAttachment(fileInput.files[0]));

    // Drag a file anywhere onto the chat to attach it
    let dragDepth = 0;
    main.addEventListener('dragenter', (e) => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; main.classList.add('dragging'); } });
    main.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; main.classList.remove('dragging'); } });
    main.addEventListener('dragover', (e) => e.preventDefault());
    main.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      main.classList.remove('dragging');
      if (e.dataTransfer.files[0]) setAttachment(e.dataTransfer.files[0]);
    });

    $('suggestions').addEventListener('click', (e) => {
      const chip = e.target.closest('.q-chip');
      if (!chip) return;
      if (chip.dataset.attach) { fileInput.click(); return; }
      messageInput.value = chip.dataset.prompt;
      autosize();
      updateSendState();
      sendMessage();
    });

    const isPhone = () => window.matchMedia('(max-width: 820px)').matches;
    const startNewChat = () => { openChat(null); app.classList.remove('drawer-open'); };
    $('newChatBtn').addEventListener('click', startNewChat);
    $('topNewBtn').addEventListener('click', startNewChat);

    // Desktop: hide/show the sidebar (remembered). Phone: slide-out drawer.
    try { if (localStorage.getItem('koda-sidebar') === 'hidden') app.classList.add('collapsed'); } catch (e) {}
    function setSidebarHidden(hidden) {
      app.classList.toggle('collapsed', hidden);
      try { localStorage.setItem('koda-sidebar', hidden ? 'hidden' : 'shown'); } catch (e) {}
    }
    $('collapseBtn').addEventListener('click', () => setSidebarHidden(true));
    $('themeBtn').addEventListener('click', () => kodaToggleTheme());
    $('sideThemeBtn').addEventListener('click', () => kodaToggleTheme());
    $('menuBtn').addEventListener('click', () => {
      if (isPhone()) app.classList.toggle('drawer-open');
      else setSidebarHidden(false);
    });
    $('backdrop').addEventListener('click', () => app.classList.remove('drawer-open'));

    document.getElementById('logoutBtn').addEventListener('click', async function () {
      await saveChats();
      await supabase.auth.signOut();
      // Leave with the same ring transition as the welcome page
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      kodaGo('index.html', this, dark ? '#000000' : '#ffffff', true);
    });

    // ---- Start ----
    const email = session?.user?.email || '';
    $('userEmail').textContent = email;
    $('userAvatar').textContent = (email[0] || 'U').toUpperCase();
    const hour = new Date().getHours();
    $('greeting').textContent = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

    // Always start on a fresh chat; earlier chats stay in the sidebar under Recents
    openChat(null);
    await loadChats();
    renderChatList();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshChats(); });
  </script>

</body>
