<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; connect-src 'self' https://hirgkfhklwtbiajpxhaw.supabase.co; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>Koda - PAN Sorter</title>
  <link rel="icon" type="image/png" href="koda-logo.png">
  <script src="koda-transition.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <style>
    /* ---- Koda theme (this page only) ---- */
    :root {
      --q-page: #f5f4ee;
      --q-bg: #faf9f5;
      --q-sidebar: #f2f0e8;
      --q-card: #ffffff;
      --q-border: #e5e2d8;
      --q-border-strong: #d6d2c4;
      --q-text: #1f1e1d;
      --q-muted: #6f6c63;
      --q-faint: #9a978d;
      --q-hover: #ebe8de;
      --q-bubble: #efece3;
      --q-accent: #c96442;
      --q-accent-hover: #b4553a;
      --q-serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
      --q-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body.qoda { height: 100%; }

    body.qoda {
      background: var(--q-bg);
      padding: 0;
      min-height: 0;
      overflow: hidden;
      color: var(--q-text);
    }

    body.qoda #authGuard {
      height: 100%;
      height: 100dvh;
      flex-direction: column;
    }

    /* Full window, like a desktop app */
    .q-app {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      background: var(--q-bg);
      overflow: hidden;
      position: relative;
    }

    /* Sidebar */
    .q-sidebar {
      width: 288px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--q-sidebar);
      border-right: 1px solid var(--q-border);
      padding: 12px 10px 10px;
      transition: margin-left 0.25s ease;
    }

    .q-app.collapsed .q-sidebar { margin-left: -289px; }

    .q-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 10px;
    }

    .q-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      font-family: var(--q-serif);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .q-side-nav {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-top: 4px;
    }

    .q-side-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      color: #3d3b36;
      text-decoration: none;
      font: 400 0.9rem var(--q-sans);
    }

    .q-side-nav a:hover { background: var(--q-hover); }
    .q-side-nav svg { color: var(--q-muted); flex-shrink: 0; }

    .q-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .q-new {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--q-text);
      font: 500 0.92rem var(--q-sans);
      cursor: pointer;
      text-align: left;
    }

    .q-new:hover { background: var(--q-hover); }

    .q-new-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--q-accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .q-recents-label {
      padding: 18px 8px 6px;
      font: 500 0.75rem var(--q-sans);
      color: var(--q-faint);
    }

    .q-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .q-list-empty { padding: 6px 8px; color: var(--q-faint); font-size: 0.85rem; }

    .q-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font: 400 0.875rem var(--q-sans);
      color: #3d3b36;
    }

    .q-item:hover { background: var(--q-hover); }
    .q-item.active { background: #e6e2d6; color: var(--q-text); }

    .q-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .q-item-delete {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--q-muted);
      cursor: pointer;
      opacity: 0;
    }

    .q-item:hover .q-item-delete, .q-item.active .q-item-delete { opacity: 1; }
    .q-item-delete:hover { background: #ddd8ca; color: #a3392a; }

    .q-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 8px 4px;
      border-top: 1px solid var(--q-border);
      font: 400 0.8rem var(--q-sans);
      color: var(--q-muted);
      min-width: 0;
    }

    .q-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #3d3b36;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .q-user-email { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-user .q-icon-btn { width: 30px; height: 30px; }
    .q-user .q-icon-btn:hover { color: #a3392a; }

    /* Main column */
    .q-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .q-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .q-title {
      flex: 1;
      min-width: 0;
      font: 500 0.92rem var(--q-sans);
      color: #3d3b36;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .q-icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--q-muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .q-icon-btn:hover { background: var(--q-hover); color: var(--q-text); }
    .q-menu-btn, .q-top-new { display: none; }
    .q-app.collapsed .q-menu-btn { display: grid; }

    .q-scroller {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .q-thread {
      max-width: 820px;
      margin: 0 auto;
      padding: 8px 24px 32px;
    }

    /* Empty state: greeting + composer in the middle, like a fresh chat */
    .q-welcome { display: none; }

    .q-main.empty .q-scroller { flex: 0 0 auto; }
    .q-main.empty .q-thread { display: none; }
    .q-main.empty { justify-content: center; }
    .q-main.empty .q-topbar { position: absolute; top: 0; left: 0; right: 0; }

    .q-main.empty .q-welcome {
      display: block;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 28px;
      text-align: center;
    }

    .q-welcome h1 {
      font-family: var(--q-serif);
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: #2b2a27;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .q-welcome h1 .q-logo { width: 44px; height: 44px; }

    .q-welcome p {
      margin-top: 10px;
      color: var(--q-muted);
      font: 400 0.95rem var(--q-sans);
    }

    /* Messages */
    .q-msg { margin: 0 0 28px; }

    .q-msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .q-bubble {
      max-width: 78%;
      background: var(--q-bubble);
      color: var(--q-text);
      padding: 10px 16px;
      border-radius: 16px;
      font: 400 0.98rem/1.55 var(--q-sans);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .q-user-files { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 78%; }

    .q-msg.assistant {
      font-family: var(--q-serif);
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--q-text);
    }

    .q-body { min-width: 0; }
    .q-body > * + * { margin-top: 14px; }

    .q-text p + p, .q-text p + ul, .q-text ul + p { margin-top: 12px; }
    .q-text ul { padding-left: 1.4em; }
    .q-text li + li { margin-top: 4px; }
    .q-text strong { font-weight: 600; }

    .q-note {
      font: 400 0.82rem var(--q-sans);
      color: var(--q-muted);
    }

    .q-actions {
      display: flex;
      gap: 2px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .q-msg.assistant:hover .q-actions { opacity: 1; }
    .q-actions .q-icon-btn { width: 28px; height: 28px; }

    /* Thinking indicator */
    .q-thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 400 0.9rem var(--q-sans);
      color: var(--q-muted);
    }

    .q-dots { display: inline-flex; gap: 4px; }

    .q-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--q-accent);
      animation: q-pulse 1.2s infinite ease-in-out;
    }

    .q-dots span:nth-child(2) { animation-delay: 0.15s; }
    .q-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes q-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Tables */
    .q-table-wrap {
      border: 1px solid var(--q-border);
      border-radius: 12px;
      overflow: auto;
      max-height: 420px;
      background: var(--q-card);
    }

    .q-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font: 400 0.85rem/1.4 var(--q-sans);
      font-variant-numeric: tabular-nums;
    }

    .q-table th {
      position: sticky;
      top: 0;
      background: #f6f4ee;
      text-align: left;
      font-weight: 600;
      color: #4a4842;
      padding: 9px 12px;
      border-bottom: 1px solid var(--q-border);
      white-space: nowrap;
    }

    .q-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f0ede5;
      vertical-align: top;
      white-space: nowrap;
    }

    .q-table td.wrap { white-space: normal; min-width: 140px; max-width: 260px; }

    .q-table tr:last-child td { border-bottom: none; }
    .q-table .num { text-align: right; white-space: nowrap; }
    .q-table .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.82rem; letter-spacing: 0.02em; }
    .q-table .muted { color: var(--q-faint); }
    .q-table-note { font: 400 0.8rem var(--q-sans); color: var(--q-muted); margin-top: 6px; }

    /* Stat cards */
    .q-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

    .q-stat {
      border: 1px solid var(--q-border);
      border-radius: 12px;
      background: var(--q-card);
      padding: 12px 14px;
    }

    .q-stat-label { font: 500 0.78rem var(--q-sans); color: var(--q-muted); }
    .q-stat-value { font-family: var(--q-serif); font-size: 1.35rem; margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* File cards (downloads and attachments) */
    .q-file {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      border: 1px solid var(--q-border);
      border-radius: 12px;
      background: var(--q-card);
      padding: 10px 12px;
      font-family: var(--q-sans);
    }

    .q-file-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font: 700 0.62rem var(--q-sans);
      letter-spacing: 0.03em;
      flex-shrink: 0;
      background: #77736a;
    }

    .q-file-icon.xlsx, .q-file-icon.xls { background: #1d6f42; }
    .q-file-icon.csv { background: #3f7d58; }
    .q-file-icon.pdf { background: #c4372b; }
    .q-file-icon.docx { background: #2b579a; }

    .q-file-info { flex: 1; min-width: 0; }
    .q-file-name { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-file-sub { font-size: 0.78rem; color: var(--q-muted); margin-top: 1px; }

    .q-file.small { padding: 6px 10px 6px 6px; gap: 10px; max-width: 280px; }
    .q-file.small .q-file-icon { width: 34px; height: 34px; }

    .q-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1px solid var(--q-border-strong);
      background: var(--q-card);
      color: var(--q-text);
      font: 500 0.85rem var(--q-sans);
      cursor: pointer;
      white-space: nowrap;
    }

    .q-btn:hover { background: #f6f4ee; }
    .q-btn:disabled { opacity: 0.55; cursor: wait; }
    .q-btn.primary { background: var(--q-text); border-color: var(--q-text); color: #fff; }
    .q-btn.primary:hover { background: #3d3b36; }

    /* Import preview */
    .q-chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--q-sans); }

    .q-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font: 500 0.75rem var(--q-sans);
      white-space: nowrap;
    }

    .q-pill.add { background: #e5f1e7; color: #2b6a3a; }
    .q-pill.fill { background: #e4edf7; color: #2a5a8a; }
    .q-pill.skip { background: #eeebe3; color: #6b6a63; }
    .q-pill.error { background: #f8e4df; color: #a3392a; }
    .q-pill.done { background: #e5f1e7; color: #2b6a3a; }

    .q-reason { display: block; font-size: 0.76rem; color: var(--q-muted); margin-top: 3px; white-space: normal; min-width: 180px; max-width: 260px; }

    .q-import-footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font: 400 0.85rem var(--q-sans);
      color: var(--q-muted);
    }

    /* Composer */
    .q-composer-wrap {
      flex-shrink: 0;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px 14px;
    }

    .q-composer {
      background: var(--q-card);
      border: 1px solid var(--q-border-strong);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(31, 30, 29, 0.05);
      padding: 12px 12px 10px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .q-composer:focus-within { border-color: #bfb9a8; box-shadow: 0 4px 24px rgba(31, 30, 29, 0.08); }

    .q-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .q-attachments:empty { display: none; }

    .q-attachments .q-file { position: relative; }

    .q-remove {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--q-border-strong);
      background: var(--q-card);
      color: var(--q-muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .q-remove:hover { color: var(--q-text); }

    .q-composer textarea {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font: 400 1rem/1.5 var(--q-sans);
      color: var(--q-text);
      max-height: 220px;
      min-height: 26px;
      padding: 2px 0;
    }

    .q-composer textarea::placeholder { color: var(--q-faint); }

    .q-composer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .q-composer-row .q-icon-btn { border: 1px solid var(--q-border); width: 32px; height: 32px; }
    .q-spacer { flex: 1; }

    .q-send {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 9px;
      background: var(--q-accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .q-send:hover { background: var(--q-accent-hover); }
    .q-send:disabled { opacity: 0.45; cursor: default; }

    .q-suggestions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .q-main.empty .q-suggestions { display: flex; }

    .q-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--q-border);
      border-radius: 10px;
      background: var(--q-bg);
      color: #4a4842;
      font: 400 0.85rem var(--q-sans);
      cursor: pointer;
    }

    .q-chip:hover { background: var(--q-card); border-color: var(--q-border-strong); color: var(--q-text); }

    .q-disclaimer {
      text-align: center;
      font: 400 0.75rem var(--q-sans);
      color: var(--q-faint);
      margin-top: 8px;
    }

    .q-main.empty .q-disclaimer { display: none; }

    /* Drag and drop */
    .q-drop {
      display: none;
      position: absolute;
      inset: 10px;
      border: 2px dashed var(--q-accent);
      border-radius: 14px;
      background: rgba(250, 249, 245, 0.92);
      z-index: 5;
      place-items: center;
      font: 500 1rem var(--q-sans);
      color: var(--q-accent);
      pointer-events: none;
    }

    .q-main.dragging .q-drop { display: grid; }

    .q-backdrop { display: none; }

    /* Phones and small tablets: full screen, sidebar becomes a drawer */
    @media (max-width: 820px) {
      .q-sidebar,
      .q-app.collapsed .q-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        width: min(300px, 86vw);
        margin-left: 0;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
      }

      .q-collapse-btn { display: none; }
      .q-top-new { display: grid; }
      .q-topbar { height: 50px; padding: 0 8px; border-bottom: 1px solid var(--q-border); }
      .q-main.empty .q-topbar { border-bottom: none; }
      .q-title { text-align: center; }
      .q-main.empty .q-welcome { padding: 0 20px 22px; }
      .q-suggestions { margin-top: 12px; }
      .q-chip { padding: 7px 11px; font-size: 0.82rem; }

      .q-app.drawer-open .q-sidebar { transform: none; }

      .q-app.drawer-open .q-backdrop {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 15;
        background: rgba(31, 30, 29, 0.25);
      }

      .q-menu-btn { display: grid; }
      .q-thread { padding: 4px 14px 24px; }
      .q-composer-wrap { padding: 0 12px 10px; }
      .q-welcome h1 { font-size: 1.6rem; }
      .q-bubble, .q-user-files { max-width: 90%; }
      .q-msg.assistant { font-size: 1rem; }
      .q-actions { opacity: 1; }
      .q-item-delete { opacity: 1; }
    }
  </style>
</head>

<body class="qoda">

  <div id="authGuard" style="display: none;">
    <div class="q-app" id="app">
      <aside class="q-sidebar">
        <div class="q-side-head">
          <div class="q-brand"><img class="q-logo" src="koda-logo.png" alt="">Koda</div>
          <button type="button" class="q-icon-btn q-collapse-btn" id="collapseBtn" title="Hide sidebar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
        </div>
        <button type="button" id="newChatBtn" class="q-new">
          <span class="q-new-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </span>
          New chat
        </button>
        <nav class="q-side-nav">
          <a href="quick-entry.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Quick Entry</a>
          <a href="full-entry.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Full Entry</a>
          <a href="display.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-3"/><path d="M12 16v-7"/><path d="M17 16V8"/></svg>Display</a>
        </nav>
        <div class="q-recents-label">Recents</div>
