<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; connect-src 'self' https://hirgkfhklwtbiajpxhaw.supabase.co; img-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>Koda - PAN Sorter</title>
  <link rel="icon" type="image/png" href="koda-logo.png">
  <script src="koda-transition.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <style>
    /* ---- Koda theme (this page only) ---- */
    :root {
      --q-page: #f5f4ee;
      --q-bg: #faf9f5;
      --q-sidebar: #f2f0e8;
      --q-card: #ffffff;
      --q-border: #e5e2d8;
      --q-border-strong: #d6d2c4;
      --q-text: #1f1e1d;
      --q-muted: #6f6c63;
      --q-faint: #9a978d;
      --q-hover: #ebe8de;
      --q-bubble: #efece3;
      --q-accent: #c96442;
      --q-accent-hover: #b4553a;
      --q-text-soft: #3d3b36;
      --q-heading: #2b2a27;
      --q-active: #e6e2d6;
      --q-danger: #a3392a;
      --q-danger-bg: #ddd8ca;
      --q-soft-bg: #f6f4ee;
      --q-table-text: #4a4842;
      --q-row-line: #f0ede5;
      --q-primary-bg: #1f1e1d;
      --q-primary-text: #ffffff;
      --q-primary-hover: #3d3b36;
      --q-avatar-bg: #3d3b36;
      --q-avatar-text: #ffffff;
      --q-focus-border: #bfb9a8;
      --q-shadow: rgba(31, 30, 29, 0.05);
      --q-shadow-focus: rgba(31, 30, 29, 0.08);
      --q-drop-bg: rgba(250, 249, 245, 0.92);
      --q-backdrop: rgba(31, 30, 29, 0.25);
      --pill-add-bg: #e5f1e7; --pill-add: #2b6a3a;
      --pill-fill-bg: #e4edf7; --pill-fill: #2a5a8a;
      --pill-skip-bg: #eeebe3; --pill-skip: #6b6a63;
      --pill-error-bg: #f8e4df; --pill-error: #a3392a;
      --q-warn-bg: #fdf3dc; --q-warn: #8a5a00;
      --q-serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
      --q-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Dark mode: same black as the welcome page and Koda login */
    :root[data-theme="dark"] {
      --q-page: #000000;
      --q-bg: #0b0b0b;
      --q-sidebar: #141414;
      --q-card: #181818;
      --q-border: #262626;
      --q-border-strong: #363636;
      --q-text: #ecebe6;
      --q-muted: #a3a097;
      --q-faint: #75736b;
      --q-hover: #1f1f1f;
      --q-bubble: #242424;
      --q-text-soft: #d6d4cc;
      --q-heading: #f2f1ec;
      --q-active: #262626;
      --q-danger: #ff8a7a;
      --q-danger-bg: #3a1f1a;
      --q-soft-bg: #1f1f1f;
      --q-table-text: #c9c7bf;
      --q-row-line: #222222;
      --q-primary-bg: #ecebe6;
      --q-primary-text: #111111;
      --q-primary-hover: #d6d4cc;
      --q-avatar-bg: #ecebe6;
      --q-avatar-text: #111111;
      --q-focus-border: #4a4a4a;
      --q-shadow: rgba(0, 0, 0, 0.4);
      --q-shadow-focus: rgba(0, 0, 0, 0.5);
      --q-drop-bg: rgba(11, 11, 11, 0.92);
      --q-backdrop: rgba(0, 0, 0, 0.55);
      --pill-add-bg: #15301c; --pill-add: #8fd19e;
      --pill-fill-bg: #142538; --pill-fill: #8bb8e8;
      --pill-skip-bg: #232323; --pill-skip: #a3a097;
      --pill-error-bg: #3a1a16; --pill-error: #ff8a7a;
      --q-warn-bg: #2e2410; --q-warn: #f5c96a;
    }

    /* The flower logo is black; show it white on dark */
    :root[data-theme="dark"] .q-logo { filter: invert(1); }

    body.qoda { transition: background 0.3s ease, color 0.3s ease; }

    html, body.qoda { height: 100%; }

    body.qoda {
      background: var(--q-bg);
      padding: 0;
      min-height: 0;
      overflow: hidden;
      color: var(--q-text);
    }

    body.qoda #authGuard {
      height: 100%;
      height: 100dvh;
      flex-direction: column;
    }

    /* Full window, like a desktop app */
    .q-app {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      background: var(--q-bg);
      overflow: hidden;
      position: relative;
    }

    /* Sidebar */
    .q-sidebar {
      width: 288px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--q-sidebar);
      border-right: 1px solid var(--q-border);
      padding: 12px 10px 10px;
      transition: margin-left 0.25s ease;
    }

    .q-app.collapsed .q-sidebar { margin-left: -289px; }

    .q-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 10px;
    }

    .q-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      font-family: var(--q-serif);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .q-side-nav {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-top: 4px;
    }

    .q-side-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      color: var(--q-text-soft);
      text-decoration: none;
      font: 400 0.9rem var(--q-sans);
    }

    .q-side-nav a:hover { background: var(--q-hover); }
    .q-side-nav svg { color: var(--q-muted); flex-shrink: 0; }

    .q-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .q-new {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--q-text);
      font: 500 0.92rem var(--q-sans);
      cursor: pointer;
      text-align: left;
    }

    .q-new:hover { background: var(--q-hover); }

    .q-new-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--q-accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .q-recents-label {
      padding: 18px 8px 6px;
      font: 500 0.75rem var(--q-sans);
      color: var(--q-faint);
    }

    .q-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .q-list-empty { padding: 6px 8px; color: var(--q-faint); font-size: 0.85rem; }

    .q-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font: 400 0.875rem var(--q-sans);
      color: var(--q-text-soft);
    }

    .q-item:hover { background: var(--q-hover); }
    .q-item.active { background: var(--q-active); color: var(--q-text); }

    .q-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .q-item-delete {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--q-muted);
      cursor: pointer;
      opacity: 0;
    }

    .q-item:hover .q-item-delete, .q-item.active .q-item-delete { opacity: 1; }
    .q-item-delete:hover { background: var(--q-danger-bg); color: var(--q-danger); }

    .q-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 8px 4px;
      border-top: 1px solid var(--q-border);
      font: 400 0.8rem var(--q-sans);
      color: var(--q-muted);
      min-width: 0;
    }

    .q-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--q-avatar-bg);
      color: var(--q-avatar-text);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .q-user-email { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-user .q-icon-btn { width: 30px; height: 30px; }
    .q-user #logoutBtn:hover { color: var(--q-danger); }

    /* Main column */
    .q-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .q-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .q-title {
      flex: 1;
      min-width: 0;
      font: 500 0.92rem var(--q-sans);
      color: var(--q-text-soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .q-icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--q-muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .q-icon-btn:hover { background: var(--q-hover); color: var(--q-text); }
    .q-menu-btn, .q-top-new { display: none; }

    .q-theme-btn svg { grid-area: 1 / 1; transition: opacity 0.3s, transform 0.4s; }
    .q-theme-btn { display: grid; }
    .q-side-theme { display: none; }
    .q-theme-btn .moon { opacity: 0; transform: rotate(-90deg) scale(0.6); }
    :root[data-theme="dark"] .q-theme-btn .sun { opacity: 0; transform: rotate(90deg) scale(0.6); }
    :root[data-theme="dark"] .q-theme-btn .moon { opacity: 1; transform: none; }
    .q-app.collapsed .q-menu-btn { display: grid; }

    .q-scroller {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .q-thread {
      max-width: 820px;
      margin: 0 auto;
      padding: 8px 24px 32px;
    }

    /* Empty state: greeting + composer in the middle, like a fresh chat */
    .q-welcome { display: none; }

    .q-main.empty .q-scroller { flex: 0 0 auto; }
    .q-main.empty .q-thread { display: none; }
    .q-main.empty { justify-content: center; }
    .q-main.empty .q-topbar { position: absolute; top: 0; left: 0; right: 0; }

    .q-main.empty .q-welcome {
      display: block;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 28px;
      text-align: center;
    }

    .q-welcome h1 {
      font-family: var(--q-serif);
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: var(--q-heading);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .q-welcome h1 .q-logo { width: 44px; height: 44px; }

    .q-welcome p {
      margin-top: 10px;
      color: var(--q-muted);
      font: 400 0.95rem var(--q-sans);
    }

    /* Messages */
    .q-msg { margin: 0 0 28px; }

    .q-msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .q-bubble {
      max-width: 78%;
      background: var(--q-bubble);
      color: var(--q-text);
      padding: 10px 16px;
      border-radius: 16px;
      font: 400 0.98rem/1.55 var(--q-sans);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .q-user-files { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 78%; }

    .q-msg.assistant {
      font-family: var(--q-serif);
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--q-text);
    }

    .q-body { min-width: 0; }
    .q-body > * + * { margin-top: 14px; }

    .q-text p + p, .q-text p + ul, .q-text ul + p { margin-top: 12px; }
    .q-text ul { padding-left: 1.4em; }
    .q-text li + li { margin-top: 4px; }
    .q-text strong { font-weight: 600; }

    .q-filter {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border: 1px solid var(--q-border);
      border-radius: 999px;
      background: var(--q-soft-bg);
      color: var(--q-muted);
      font: 400 0.8rem/1.4 var(--q-sans);
    }

    .q-filter-ignored { color: var(--q-warn); }

    .q-note {
      font: 400 0.82rem var(--q-sans);
      color: var(--q-muted);
    }

    .q-actions {
      display: flex;
      gap: 2px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .q-msg.assistant:hover .q-actions { opacity: 1; }

    /* Your messages: Copy / Edit appear on hover; the version switcher is always shown */
    .q-msg.user { gap: 4px; margin-bottom: 22px; }
    .q-user-actions { opacity: 1; justify-content: flex-end; align-items: center; margin-top: 2px; }
    .q-user-actions > .q-icon-btn { opacity: 0; transition: opacity 0.15s; }
    .q-msg.user:hover .q-user-actions > .q-icon-btn,
    .q-user-actions > .q-icon-btn:focus-visible { opacity: 1; }

    .q-versions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-right: 4px;
      font: 500 0.78rem var(--q-sans);
      color: var(--q-muted);
    }

    .q-versions .q-icon-btn { width: 26px; height: 26px; }
    .q-versions .q-icon-btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
    .q-version-label { min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }

    /* Editing a message */
    .q-msg.user.editing { align-items: stretch; }

    .q-edit {
      width: 100%;
      background: var(--q-card);
      border: 1px solid var(--q-border-strong);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 20px var(--q-shadow);
    }

    .q-edit textarea {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--q-text);
      font: 400 1rem/1.5 var(--q-sans);
      max-height: 240px;
    }

    .q-edit-warning {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--q-warn-bg);
      color: var(--q-warn);
      font: 400 0.82rem/1.45 var(--q-sans);
    }

    .q-edit-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .q-actions .q-icon-btn { width: 28px; height: 28px; }

    /* Thinking indicator */
    .q-thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 400 0.9rem var(--q-sans);
      color: var(--q-muted);
    }

    .q-dots { display: inline-flex; gap: 4px; }

    .q-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--q-accent);
      animation: q-pulse 1.2s infinite ease-in-out;
    }

    .q-dots span:nth-child(2) { animation-delay: 0.15s; }
    .q-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes q-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Tables */
    .q-table-wrap {
      border: 1px solid var(--q-border);
      border-radius: 12px;
      overflow: auto;
      max-height: 420px;
      background: var(--q-card);
    }

    .q-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font: 400 0.85rem/1.4 var(--q-sans);
      font-variant-numeric: tabular-nums;
    }

    .q-table th {
      position: sticky;
      top: 0;
      background: var(--q-soft-bg);
      text-align: left;
      font-weight: 600;
      color: var(--q-table-text);
      padding: 9px 12px;
      border-bottom: 1px solid var(--q-border);
      white-space: nowrap;
    }

    .q-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--q-row-line);
      vertical-align: top;
      white-space: nowrap;
    }

    .q-table td.wrap { white-space: normal; min-width: 140px; max-width: 260px; }
    /* The website's shared table colours are for white pages; Koda's tables follow the theme */
    .q-table td { color: var(--q-text); background: transparent; }

    .q-table tr:last-child td { border-bottom: none; }
    .q-table .num { text-align: right; white-space: nowrap; }
    .q-table .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.82rem; letter-spacing: 0.02em; }
    .q-table .muted { color: var(--q-faint); }
    .q-table-note { font: 400 0.8rem var(--q-sans); color: var(--q-muted); margin-top: 6px; }

    /* Stat cards */
    .q-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

    .q-stat {
      border: 1px solid var(--q-border);
      border-radius: 12px;
      background: var(--q-card);
      padding: 12px 14px;
    }

    .q-stat-label { font: 500 0.78rem var(--q-sans); color: var(--q-muted); }
    .q-stat-value { font-family: var(--q-serif); font-size: 1.35rem; margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* File cards (downloads and attachments) */
    .q-file {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      border: 1px solid var(--q-border);
      border-radius: 12px;
      background: var(--q-card);
      padding: 10px 12px;
      font-family: var(--q-sans);
    }

    .q-file-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font: 700 0.62rem var(--q-sans);
      letter-spacing: 0.03em;
      flex-shrink: 0;
      background: #77736a;
    }

    .q-file-icon.xlsx, .q-file-icon.xls { background: #1d6f42; }
    .q-file-icon.csv { background: #3f7d58; }
    .q-file-icon.pdf { background: #c4372b; }
    .q-file-icon.docx { background: #2b579a; }

    .q-file-info { flex: 1; min-width: 0; }
    .q-file-name { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-file-sub { font-size: 0.78rem; color: var(--q-muted); margin-top: 1px; }

    .q-file.small { padding: 6px 10px 6px 6px; gap: 10px; max-width: 280px; }
    .q-file.small .q-file-icon { width: 34px; height: 34px; }

    .q-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1px solid var(--q-border-strong);
      background: var(--q-card);
      color: var(--q-text);
      font: 500 0.85rem var(--q-sans);
      cursor: pointer;
      white-space: nowrap;
    }

    .q-btn:hover { background: var(--q-soft-bg); }
    .q-btn:disabled { opacity: 0.55; cursor: wait; }
    .q-btn.primary { background: var(--q-primary-bg); border-color: var(--q-primary-bg); color: var(--q-primary-text); }
    .q-btn.primary:hover { background: var(--q-primary-hover); }

    /* Import preview */
    .q-chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--q-sans); }

    .q-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font: 500 0.75rem var(--q-sans);
      white-space: nowrap;
    }

    .q-pill.add { background: var(--pill-add-bg); color: var(--pill-add); }
    .q-pill.fill { background: var(--pill-fill-bg); color: var(--pill-fill); }
    .q-pill.skip { background: var(--pill-skip-bg); color: var(--pill-skip); }
    .q-pill.error { background: var(--pill-error-bg); color: var(--pill-error); }
    .q-pill.done { background: var(--pill-add-bg); color: var(--pill-add); }

    .q-reason { display: block; font-size: 0.76rem; color: var(--q-muted); margin-top: 3px; white-space: normal; min-width: 180px; max-width: 260px; }

    .q-import-footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font: 400 0.85rem var(--q-sans);
      color: var(--q-muted);
    }

    /* Composer */
    .q-composer-wrap {
      flex-shrink: 0;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px 14px;
    }

    .q-composer {
      background: var(--q-card);
      border: 1px solid var(--q-border-strong);
      border-radius: 20px;
      box-shadow: 0 4px 20px var(--q-shadow);
      padding: 12px 12px 10px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .q-composer:focus-within { border-color: var(--q-focus-border); box-shadow: 0 4px 24px var(--q-shadow-focus); }

    .q-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .q-attachments:empty { display: none; }

    .q-attachments .q-file { position: relative; }

    .q-remove {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--q-border-strong);
      background: var(--q-card);
      color: var(--q-muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .q-remove:hover { color: var(--q-text); }

    .q-composer textarea {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font: 400 1rem/1.5 var(--q-sans);
      color: var(--q-text);
      max-height: 220px;
      min-height: 26px;
      padding: 2px 0;
    }

    .q-composer textarea::placeholder { color: var(--q-faint); }

    .q-composer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .q-composer-row .q-icon-btn { border: 1px solid var(--q-border); width: 32px; height: 32px; }
    .q-spacer { flex: 1; }

    .q-send {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 9px;
      background: var(--q-accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .q-send:hover { background: var(--q-accent-hover); }
    .q-send:disabled { opacity: 0.45; cursor: default; }

    .q-suggestions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .q-main.empty .q-suggestions { display: flex; }

    .q-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid var(--q-border);
      border-radius: 10px;
      background: var(--q-bg);
      color: var(--q-table-text);
      font: 400 0.85rem var(--q-sans);
      cursor: pointer;
    }

    .q-chip:hover { background: var(--q-card); border-color: var(--q-border-strong); color: var(--q-text); }

    .q-disclaimer {
      text-align: center;
      font: 400 0.75rem var(--q-sans);
      color: var(--q-faint);
      margin-top: 8px;
    }

    .q-main.empty .q-disclaimer { display: none; }

    /* Drag and drop */
    .q-drop {
      display: none;
      position: absolute;
      inset: 10px;
      border: 2px dashed var(--q-accent);
      border-radius: 14px;
      background: var(--q-drop-bg);
      z-index: 5;
      place-items: center;
      font: 500 1rem var(--q-sans);
      color: var(--q-accent);
      pointer-events: none;
    }

    .q-main.dragging .q-drop { display: grid; }

    .q-backdrop { display: none; }

    /* Phones and small tablets: full screen, sidebar becomes a drawer */
    @media (max-width: 820px) {
      .q-sidebar,
      .q-app.collapsed .q-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        width: min(300px, 86vw);
        margin-left: 0;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
      }

      .q-collapse-btn { display: none; }
      .q-top-new { display: grid; }
      /* Phones: the light/dark toggle lives in the menu, next to Log out */
      .q-topbar .q-theme-btn { display: none; }
      .q-side-theme { display: grid; }
      .q-topbar { height: 50px; padding: 0 8px; border-bottom: 1px solid var(--q-border); }
      .q-main.empty .q-topbar { border-bottom: none; }
      .q-title { text-align: center; }
      .q-main.empty .q-welcome { padding: 0 20px 22px; }
      .q-suggestions { margin-top: 12px; }
      .q-chip { padding: 7px 11px; font-size: 0.82rem; }

      .q-app.drawer-open .q-sidebar { transform: none; }

      .q-app.drawer-open .q-backdrop {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 15;
        background: var(--q-backdrop);
      }

      .q-menu-btn { display: grid; }
      .q-thread { padding: 4px 14px 24px; }
      .q-composer-wrap { padding: 0 12px 10px; }
      .q-welcome h1 { font-size: 1.6rem; }
      .q-bubble, .q-user-files { max-width: 90%; }
      .q-msg.assistant { font-size: 1rem; }
      .q-actions { opacity: 1; }
      /* Phones have no hover: Copy / Edit are always shown, a little faint, with bigger tap targets */
      .q-user-actions > .q-icon-btn { opacity: 0.7; width: 34px; height: 34px; }
      .q-versions .q-icon-btn { width: 32px; height: 32px; }
      .q-edit-buttons .q-btn { flex: 1; justify-content: center; padding: 11px 14px; font-size: 0.95rem; }
      .q-item-delete { opacity: 1; }
    }
  </style>
</head>

  <script type="module">
    import { supabase, supabaseUrl, supabaseAnonKey } from './supabase-config.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'koda-login.html?redirect=chat.html';
    } else {
      document.getElementById('authGuard').style.display = 'flex';
    }

    // AI requests go through our Supabase Edge Function, which keeps the Groq key secret
    const AI_PROXY_URL = supabaseUrl + '/functions/v1/groq-proxy';
    // Free Groq plan: ~8000 tokens/minute per model. If the first model is busy, the next one is tried.
    const GROQ_MODELS = ['openai/gpt-oss-20b', 'qwen/qwen3.8-27b'];
    const AI_TIMEOUT_MS = 20000;
    const MAX_ROWS = 50;
    const MAX_FILE_MB = 10;
    const MAX_IMPORT_ROWS = 2000;

    const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const MAMMOTH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    const AUTOTABLE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js';

    const $ = (id) => document.getElementById(id);
    const app = $('app');
    const main = $('main');
    const scroller = $('scroller');
    const chatMessages = $('chatMessages');
    const messageForm = $('messageForm');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const chatList = $('chatList');
    const fileInput = $('fileInput');
    const attachments = $('attachments');

    // ---- Small helpers ----
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const money = (v) => '₹' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const isNum = (v) => typeof v === 'number' && !isNaN(v);
    const plural = (n, word = 'entr') => n + ' ' + word + (word === 'entr' ? (n === 1 ? 'y' : 'ies') : (n === 1 ? '' : 's'));
    const normName = (n) => String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const fileExt = (name) => (String(name).split('.').pop() || '').toLowerCase();
    const PAN_RE = /\b([A-Z]{5}[0-9]{4}[A-Z])\b/;

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function icon(name, size = 16) {
      const paths = {
        copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
        x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
        filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
        edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        left: '<polyline points="15 18 9 12 15 6"/>',
        right: '<polyline points="9 18 15 12 9 6"/>'
      };
      const span = el('span');
      span.style.display = 'inline-flex';
      span.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
      return span;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    const scriptCache = {};
    function loadScript(src) {
      return scriptCache[src] ||= new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = () => { delete scriptCache[src]; reject(new Error('Could not load ' + src.split('/').pop())); };
        document.head.appendChild(s);
      });
    }

    // ---- Saved chats: kept in your Supabase account (table koda_chats), so they follow you to any device ----
    // Older versions kept chats in this browser only; those are uploaded once and then removed from the browser.
    const userId = session?.user?.id || 'anon';
    const LOCAL_CHATS_KEY = 'pansorter_chats_' + userId;

    // Older chats stored plain text; convert them to the block format
    function normalizeMessage(m) {
      if (m.role === 'user') return m.text !== undefined ? m : { role: 'user', text: m.content || '', files: [] };
      if (m.blocks) return m;
      const blocks = [{ type: 'text', text: m.content || '' }];
      if (m.download) {
        blocks.push({ type: 'file', request: m.download, format: m.download.format, fileName: 'PAN_Entries' + (m.download.format === 'pdf' ? '.pdf' : '.xlsx') });
      }
      return m.action ? { role: 'assistant', blocks, action: m.action } : { role: 'assistant', blocks };
    }

    function readLocalChats() {
      try {
        const list = JSON.parse(localStorage.getItem(LOCAL_CHATS_KEY) || '[]');
        if (!Array.isArray(list)) return [];
        list.forEach(c => { c.messages = (c.messages || []).map(normalizeMessage); });
        return list.filter(c => c && c.id && c.messages.length);
      } catch (e) {
        return [];
      }
    }

    // Fallback when the account copy can't be reached: keep chats in this browser like before
    function writeLocalChats() {
      while (true) {
        try {
          localStorage.setItem(LOCAL_CHATS_KEY, JSON.stringify(chats));
          return;
        } catch (e) {
          if (chats.length <= 1) return;
          chats.pop();
        }
      }
    }

    let chats = [];               // [{ id, title, updatedAt, messages }], newest first
    let chatsLoading = true;
    let activeId = null;          // null = a new chat that has no messages yet
    let busy = false;
    let pendingFile = null;

    let inAccount = false;        // true once chats load from the account
    const savedCopy = new Map();  // chat id -> what was last saved, so only changed chats are uploaded
    const snapshot = (c) => JSON.stringify([c.title, c.messages]);
    const fromRow = (r) => ({ id: r.id, title: r.title, updatedAt: Date.parse(r.updated_at) || Date.now(), messages: (r.messages || []).map(normalizeMessage) });

    async function fetchAccountChats() {
      const { data, error } = await supabase
        .from('koda_chats').select('id, title, messages, updated_at')
        .order('updated_at', { ascending: false }).limit(200);
      if (error) throw new Error(error.message);
      return data.map(fromRow);
    }

    async function loadChats() {
      const startedMeanwhile = chats.slice();   // chats begun before loading finished
      const keep = (list) => [...startedMeanwhile, ...list.filter(c => !startedMeanwhile.some(s => s.id === c.id))];
      try {
        chats = keep(await fetchAccountChats());
        inAccount = true;
      } catch (err) {
        console.warn('Chat history in your account is unavailable; using this browser instead:', err.message);
        chats = keep(readLocalChats());
        chatsLoading = false;
        if (startedMeanwhile.length) saveChats();
        return;
      }
      chats.forEach(c => { if (!startedMeanwhile.includes(c)) savedCopy.set(c.id, snapshot(c)); });

      // One-time move of chats this browser saved with the older version
      const local = readLocalChats().filter(l => !chats.some(c => c.id === l.id));
      if (local.length) chats = [...chats, ...local].sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
      chatsLoading = false;
      // Uploads the moved chats and any chat started while loading
      await saveChats();
      if (local.every(l => savedCopy.get(l.id) === snapshot(l))) {
        try { localStorage.removeItem(LOCAL_CHATS_KEY); } catch (e) {}
      }
    }

    // Upload every chat that changed since it was last saved; saves run one after another
    let saveQueue = Promise.resolve();
    function saveChats() {
      // Never save while loading: it would overwrite chats that haven't been read yet
      if (chatsLoading) return Promise.resolve();
      if (!inAccount) { writeLocalChats(); return Promise.resolve(); }
      saveQueue = saveQueue.then(async () => {
        const changed = chats.filter(c => c.messages.length && savedCopy.get(c.id) !== snapshot(c));
        if (!changed.length) return;
        const snaps = changed.map(snapshot);
        const { error } = await supabase.from('koda_chats').upsert(changed.map(c => ({
          user_id: userId, id: c.id, title: c.title, messages: c.messages,
          updated_at: new Date(c.updatedAt || Date.now()).toISOString()
        })), { onConflict: 'user_id,id' });
        if (error) { console.warn('Could not save chats to your account:', error.message); return; }
        changed.forEach((c, i) => savedCopy.set(c.id, snaps[i]));
      }).catch(err => console.warn('Could not save chats to your account:', err.message));
      return saveQueue;
    }

    // Coming back to this tab: pick up chats added, changed or deleted on another device
    async function refreshChats() {
      if (!inAccount || busy || chatsLoading || document.querySelector('.q-edit')) return;
      let fresh;
      try { fresh = await fetchAccountChats(); } catch (e) { return; }
      if (busy) return;
      const unsaved = chats.filter(c => savedCopy.get(c.id) !== snapshot(c));
      const merged = fresh.map(r => {
        const mine = chats.find(c => c.id === r.id);
        return mine && unsaved.includes(mine) && mine.updatedAt >= r.updatedAt ? mine : r;
      });
      unsaved.forEach(c => { if (!merged.some(m => m.id === c.id)) merged.push(c); });
      merged.forEach(c => { if (!unsaved.includes(c)) savedCopy.set(c.id, snapshot(c)); });
      const before = getChat(activeId);
      chats = merged.sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
      const after = getChat(activeId);
      if (activeId && !after) openChat(null);
      else if (after && (!before || snapshot(before) !== snapshot(after))) { renderActiveChat(true); setEmptyState(); }
      renderChatList();
    }

    const getChat = (id) => chats.find(c => c.id === id) || null;

    function newId() {
      return (crypto.randomUUID && crypto.randomUUID()) || (Date.now().toString(36) + Math.random().toString(36).slice(2));
    }

    // Plain-text version of a message, used for AI context and copying
    function blocksToText(blocks) {
      return blocks.map(b => {
        if (b.type === 'text' || b.type === 'note') return b.text;
        if (b.type === 'stats') return b.items.map(i => i.label + ': ' + i.value).join('\n');
        if (b.type === 'table') return b.columns.map(c => c.label).join(' | ') + '\n' + b.rows.map(r => r.map(c => typeof c === 'object' ? c.text : c).join(' | ')).join('\n');
        if (b.type === 'file') return 'Created file ' + b.fileName;
        if (b.type === 'dedupe') return 'Duplicate check: ' + plural(b.rows.length, 'duplicate') + (b.done ? ' (removed)' : ' (not removed yet)');
        if (b.type === 'filter') return 'Filter: ' + (b.parts.length ? b.parts.join(', ') : 'all entries');
        if (b.type === 'import') return 'Import preview of ' + b.fileName + ': ' + importCounts(b).map(c => c.n + ' ' + c.label).join(', ') + (b.done ? ' (imported)' : '');
        return '';
      }).filter(Boolean).join('\n\n');
    }

    function messageText(m) {
      if (m.role === 'user') return (m.text || '') + (m.files?.length ? ' [attached: ' + m.files.map(f => f.name).join(', ') + ']' : '');
      return blocksToText(m.blocks);
    }

    function renderChatList() {
      chatList.textContent = '';
      if (!chats.length) {
        chatList.appendChild(el('div', 'q-list-empty', chatsLoading ? 'Loading chats…' : 'No chats yet'));
        return;
      }
      chats.forEach(chat => {
        const item = el('div', 'q-item' + (chat.id === activeId ? ' active' : ''));
        item.title = chat.title;
        const del = el('button', 'q-item-delete');
        del.type = 'button';
        del.title = 'Delete chat';
        del.appendChild(icon('trash', 14));
        del.addEventListener('click', e => { e.stopPropagation(); deleteChat(chat.id); });
        item.append(el('span', 'q-item-title', chat.title), del);
        item.addEventListener('click', () => { openChat(chat.id); app.classList.remove('drawer-open'); });
        chatList.appendChild(item);
      });
    }

    function setEmptyState() {
      const chat = getChat(activeId);
      main.classList.toggle('empty', !chat || !chat.messages.length);
      $('chatTitle').textContent = chat ? chat.title : '';
    }

    // Draw the open chat's messages; keepScroll stays at the same place (used when switching versions)
    function renderActiveChat(keepScroll) {
      const chat = getChat(activeId);
      const top = scroller.scrollTop;
      chatMessages.textContent = '';
      if (chat) chat.messages.forEach(m => chatMessages.appendChild(renderMessage(m)));
      if (keepScroll) scroller.scrollTop = top;
      else scrollToBottom();
    }

    function openChat(id) {
      const chat = id ? getChat(id) : null;
      activeId = chat ? chat.id : null;
      renderActiveChat();
      setEmptyState();
      saveChats();
      renderChatList();
      scrollToBottom();
      messageInput.focus();
    }

    function deleteChat(id) {
      const chat = getChat(id);
      if (!chat || !confirm('Delete chat "' + chat.title + '"?')) return;
      chats = chats.filter(c => c.id !== id);
      savedCopy.delete(id);
      if (inAccount) {
        supabase.from('koda_chats').delete().eq('id', id).then(({ error }) => { if (error) console.warn('Could not delete the chat from your account:', error.message); });
      }
      if (activeId === id) openChat(null);
      else { saveChats(); renderChatList(); }
    }

    function scrollToBottom() {
      scroller.scrollTop = scroller.scrollHeight;
    }

    // ---- Rendering messages ----
    function renderInline(parent, text) {
      String(text).split(/(\*\*[^*]+\*\*)/g).forEach(part => {
        if (/^\*\*[^*]+\*\*$/.test(part)) parent.appendChild(el('strong', null, part.slice(2, -2)));
        else if (part) parent.appendChild(document.createTextNode(part));
      });
    }

    // Paragraphs, bullet lists and **bold**; everything goes in as text, never HTML
    function renderText(text) {
      const wrap = el('div', 'q-text');
      String(text).trim().split(/\n{2,}/).forEach(para => {
        const lines = para.split('\n');
        if (lines.every(l => /^\s*[•\-*]\s+/.test(l))) {
          const ul = el('ul');
          lines.forEach(l => { const li = el('li'); renderInline(li, l.replace(/^\s*[•\-*]\s+/, '')); ul.appendChild(li); });
          wrap.appendChild(ul);
        } else {
          const p = el('p');
          lines.forEach((l, i) => { if (i) p.appendChild(el('br')); renderInline(p, l); });
          wrap.appendChild(p);
        }
      });
      return wrap;
    }

    function renderTable(b) {
      const frag = el('div');
      const wrap = el('div', 'q-table-wrap');
      const table = el('table', 'q-table');
      const head = el('tr');
      b.columns.forEach(c => head.appendChild(el('th', c.num ? 'num' : '', c.label)));
      const thead = el('thead');
      thead.appendChild(head);
      const tbody = el('tbody');
      b.rows.forEach(r => {
        const tr = el('tr');
        r.forEach((cell, i) => {
          const col = b.columns[i];
          const td = el('td', [col.num && 'num', col.mono && 'mono', col.wrap && 'wrap'].filter(Boolean).join(' '));
          if (cell && typeof cell === 'object') {
            td.appendChild(el('span', 'q-pill ' + cell.pill, cell.text));
            if (cell.reason) td.appendChild(el('span', 'q-reason', cell.reason));
          } else if (cell === '' || cell == null) {
            td.className += ' muted';
            td.textContent = '—';
          } else {
            td.textContent = cell;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.append(thead, tbody);
      wrap.appendChild(table);
      frag.appendChild(wrap);
      if (b.note) frag.appendChild(el('div', 'q-table-note', b.note));
      return frag;
    }

    function renderStats(b) {
      const grid = el('div', 'q-stats');
      b.items.forEach(i => {
        const card = el('div', 'q-stat');
        card.append(el('div', 'q-stat-label', i.label), el('div', 'q-stat-value', i.value));
        grid.appendChild(card);
      });
      return grid;
    }

    function fileCard(name, sub, small) {
      const card = el('div', 'q-file' + (small ? ' small' : ''));
      const ext = fileExt(name);
      card.append(el('div', 'q-file-icon ' + ext, ext.toUpperCase().slice(0, 4)));
      const info = el('div', 'q-file-info');
      info.append(el('div', 'q-file-name', name), el('div', 'q-file-sub', sub));
      card.appendChild(info);
      return card;
    }

    function renderFile(b) {
      const sub = b.rows
        ? 'Cleaned Excel · ' + plural(b.rows.length, 'row')
        : (b.format === 'pdf' ? 'PDF report' : 'Excel spreadsheet') + (b.count != null ? ' · ' + plural(b.count) : '');
      const card = fileCard(b.fileName, sub);
      const btn = el('button', 'q-btn');
      btn.type = 'button';
      btn.title = b.rows ? 'Download the cleaned file' : 'Download again with the latest data';
      btn.append(icon('download', 14), document.createTextNode('Download'));
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const result = b.rows ? await saveExcel(b.rows, b.fileName) : await exportEntries(b.request);
          if (typeof result === 'string') alert(result);
        } catch (err) {
          alert('Download failed: ' + err.message);
        }
        btn.disabled = false;
      });
      card.appendChild(btn);
      return card;
    }

    const STATUS_LABEL = { add: 'New', fill: 'Completes Quick Entry', skip: 'Already in register', error: 'Problem' };
    const REPEATED_IN_FILE = 'Repeated earlier in this file.';
    const statusLabel = (r) => r.status === 'skip' && r.reason === REPEATED_IN_FILE ? 'Repeated in file' : STATUS_LABEL[r.status];

    function importCounts(b) {
      const count = (s) => b.rows.filter(r => r.status === s).length;
      return [
        { pill: 'add', n: count('add'), label: 'new' },
        { pill: 'fill', n: count('fill'), label: 'complete a Quick Entry' },
        { pill: 'skip', n: b.rows.filter(r => r.status === 'skip' && r.reason !== REPEATED_IN_FILE).length, label: 'already in the register' },
        { pill: 'skip', n: b.rows.filter(r => r.status === 'skip' && r.reason === REPEATED_IN_FILE).length, label: 'repeated in the file' },
        { pill: 'error', n: count('error'), label: 'with problems' }
      ].filter(c => c.n);
    }

    function renderImport(b, msg) {
      const box = el('div');
      box.style.display = 'grid';
      box.style.gridTemplateColumns = 'minmax(0, 1fr)';   // let the table scroll instead of widening the chat
      box.style.gap = '12px';

      const chips = el('div', 'q-chips');
      importCounts(b).forEach(c => chips.appendChild(el('span', 'q-pill ' + c.pill, c.n + ' ' + c.label)));
      box.appendChild(chips);

      const shown = b.rows.slice(0, 200);
      box.appendChild(renderTable({
        columns: [{ label: '#' }, { label: 'Status' }, { label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Date' }, { label: 'Amount', num: true }, { label: 'Tax', num: true }, { label: 'Ded. %', num: true }],
        rows: shown.map((r, i) => [
          String(i + 1),
          { pill: r.status, text: statusLabel(r), reason: r.status === 'add' ? '' : r.reason },
          r.pan, r.name, r.date || '',
          isNum(r.amount) ? money(r.amount) : (r.amount ?? ''),
          isNum(r.tax_amount) ? money(r.tax_amount) : (r.tax_amount ?? ''),
          r.deduction_percentage ?? ''
        ]),
        note: b.rows.length > shown.length ? `Showing the first ${shown.length} of ${b.rows.length} rows.` : ''
      }));

      const footer = el('div', 'q-import-footer');
      const ready = b.rows.filter(r => r.status === 'add' || r.status === 'fill').length;
      if (b.done) {
        const parts = [];
        if (b.done.added) parts.push('added ' + plural(b.done.added));
        if (b.done.filled) parts.push('completed ' + b.done.filled + ' Quick ' + (b.done.filled === 1 ? 'Entry' : 'Entries'));
        if (b.done.failed) parts.push(b.done.failed + ' could not be saved');
        const done = el('span', 'q-pill done');
        done.append(icon('check', 12), document.createTextNode(parts.length ? capitalize(parts.join(', ')) : 'Nothing was added'));
        footer.appendChild(done);
      } else if (ready) {
        const btn = el('button', 'q-btn primary', 'Add ' + plural(ready));
        btn.type = 'button';
        btn.addEventListener('click', () => commitImport(b, msg, btn));
        footer.append(btn, el('span', null, 'Rows that are already in the register or have problems will be skipped.'));
      } else {
        footer.appendChild(el('span', null, 'There is nothing new to add from this file.'));
      }
      box.appendChild(footer);
      return box;
    }

    const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    function renderBlock(b, msg) {
      if (b.type === 'text') return renderText(b.text);
      if (b.type === 'note') return el('div', 'q-note', b.text);
      if (b.type === 'table') return renderTable(b);
      if (b.type === 'stats') return renderStats(b);
      if (b.type === 'file') return renderFile(b);
      if (b.type === 'import') return renderImport(b, msg);
      if (b.type === 'dedupe') return renderDedupe(b, msg);
      if (b.type === 'filter') {
        const row = el('div', 'q-filter');
        row.append(icon('filter', 13), el('span', null, b.parts.length ? b.parts.join(' · ') : 'All entries'));
        if (b.ignored && b.ignored.length) row.appendChild(el('span', 'q-filter-ignored', 'Couldn\'t use: ' + b.ignored.join('; ')));
        return row;
      }
      return el('div');
    }

    function renderMessage(m) {
      if (m.role === 'user') {
        const row = el('div', 'q-msg user');
        if (m.files?.length) {
          const files = el('div', 'q-user-files');
          m.files.forEach(f => files.appendChild(fileCard(f.name, fileExt(f.name).toUpperCase() + ' · ' + formatSize(f.size), true)));
          row.appendChild(files);
        }
        if (m.text) row.appendChild(el('div', 'q-bubble', m.text));
        row.appendChild(userActions(m, row));
        return row;
      }

      const row = el('div', 'q-msg assistant');
      const body = el('div', 'q-body');
      m.blocks.forEach(b => body.appendChild(renderBlock(b, m)));
      row.appendChild(body);

      const actions = el('div', 'q-actions');
      actions.appendChild(copyButton(() => blocksToText(m.blocks)));
      row.appendChild(actions);
      return row;
    }

    function iconButton(name, title, onClick) {
      const b = el('button', 'q-icon-btn');
      b.type = 'button';
      b.title = title;
      b.setAttribute('aria-label', title);
      b.appendChild(icon(name, 15));
      b.addEventListener('click', onClick);
      return b;
    }

    function copyButton(getText) {
      const b = iconButton('copy', 'Copy', async () => {
        try {
          await navigator.clipboard.writeText(getText());
          b.replaceChildren(icon('check', 15));
          setTimeout(() => b.replaceChildren(icon('copy', 15)), 1500);
        } catch (e) {}
      });
      return b;
    }

    // ‹ 1/2 › switcher (once edited), Copy and Edit under your own messages
    function userActions(m, row) {
      const bar = el('div', 'q-actions q-user-actions');
      if (m.versions && m.versions.length > 1) {
        const switcher = el('div', 'q-versions');
        const prev = iconButton('left', 'Previous version', () => switchVersion(m, m.v - 1));
        const next = iconButton('right', 'Next version', () => switchVersion(m, m.v + 1));
        prev.disabled = m.v === 0;
        next.disabled = m.v === m.versions.length - 1;
        switcher.append(prev, el('span', 'q-version-label', (m.v + 1) + ' / ' + m.versions.length), next);
        bar.appendChild(switcher);
      }
      if (m.text) bar.appendChild(copyButton(() => m.text));
      // Attached files aren't kept after sending, so only text messages can be edited
      if (m.text && !(m.files && m.files.length)) bar.appendChild(iconButton('edit', 'Edit', () => startEdit(m, row)));
      return bar;
    }

    // ---- Editing messages and switching between versions ----
    // An edited message keeps m.versions = [{ text, after }] and m.v = the version shown.
    // The messages after it in chat.messages belong to the shown version; the other versions
    // keep theirs in "after", so switching back shows that whole conversation as it was.

    // Did the reply to this message change the register? (saved, updated, deleted or imported)
    function changedData(chat, i) {
      const reply = chat.messages[i + 1];
      if (!reply || reply.role !== 'assistant') return false;
      if (reply.blocks.some(b => (b.type === 'import' || b.type === 'dedupe') && b.done)) return true;
      const first = reply.blocks[0];
      return !!(reply.action && ['insert', 'update', 'delete'].includes(reply.action.action) &&
        first && first.type === 'text' && first.text.startsWith('Done.'));
    }

    function startEdit(m, row) {
      const chat = getChat(activeId);
      const i = chat ? chat.messages.indexOf(m) : -1;
      if (busy || i < 0 || row.classList.contains('editing')) return;

      const box = el('div', 'q-edit');
      const input = el('textarea');
      input.value = m.text;
      input.rows = 1;
      box.appendChild(input);
      if (changedData(chat, i)) {
        box.appendChild(el('div', 'q-edit-warning', 'This message already changed your register. Editing it sends a new request and won\'t undo the earlier change.'));
      }
      const buttons = el('div', 'q-edit-buttons');
      const cancel = el('button', 'q-btn', 'Cancel');
      const save = el('button', 'q-btn primary', 'Save');
      cancel.type = save.type = 'button';
      buttons.append(cancel, save);
      box.appendChild(buttons);

      row.classList.add('editing');
      row.replaceChildren(box);

      const fit = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 240) + 'px'; };
      const close = () => row.replaceWith(renderMessage(m));
      const submit = () => {
        const text = input.value.trim();
        if (!text || busy) return;
        if (text === m.text) { close(); return; }
        submitEdit(m, text);
      };
      input.addEventListener('input', () => { fit(); save.disabled = !input.value.trim(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      });
      cancel.addEventListener('click', close);
      save.addEventListener('click', submit);

      fit();
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
      box.scrollIntoView({ block: 'nearest' });
    }

    async function submitEdit(m, text) {
      const chat = getChat(activeId);
      const i = chat ? chat.messages.indexOf(m) : -1;
      if (busy || i < 0) return;
      if (!m.versions) { m.versions = [{ text: m.text, after: [] }]; m.v = 0; }
      // Keep the current version's reply and everything after it, then start the new version
      m.versions[m.v].after = chat.messages.slice(i + 1);
      m.versions.push({ text, after: [] });
      m.v = m.versions.length - 1;
      m.text = text;
      chat.messages = chat.messages.slice(0, i + 1);
      saveChats();
      renderActiveChat();
      await respond(chat, text, null, chat.messages.slice(0, i));
    }

    function switchVersion(m, k) {
      const chat = getChat(activeId);
      const i = chat ? chat.messages.indexOf(m) : -1;
      if (busy || i < 0 || !m.versions || k < 0 || k >= m.versions.length || k === m.v) return;
      m.versions[m.v].after = chat.messages.slice(i + 1);
      m.v = k;
      m.text = m.versions[k].text;
      chat.messages = chat.messages.slice(0, i + 1).concat(m.versions[k].after);
      m.versions[k].after = [];   // now live in chat.messages
      saveChats();
      renderActiveChat(true);
    }

    function appendMessage(m) {
      const node = renderMessage(m);
      chatMessages.appendChild(node);
      scrollToBottom();
      return node;
    }

    function appendThinking(text) {
      const row = el('div', 'q-msg assistant');
      const t = el('div', 'q-thinking');
      const dots = el('span', 'q-dots');
      dots.append(el('span'), el('span'), el('span'));
      const label = el('span', null, text);
      t.append(dots, label);
      row.appendChild(t);
      chatMessages.appendChild(row);
      scrollToBottom();
      row.setStatus = (s) => { label.textContent = s; };
      return row;
    }

    // Shorthand for building replies
    const T = (text) => ({ type: 'text', text });
    const say = (text) => ({ blocks: [T(text)] });

    function entriesTable(rows, note) {
      return {
        type: 'table',
        columns: [{ label: 'PAN', mono: true }, { label: 'Name', wrap: true }, { label: 'Date' }, { label: 'Amount', num: true }, { label: 'Tax', num: true }, { label: 'Deduction', num: true }],
        rows: rows.map(e => [e.pan_number, e.name || '', e.date || '', money(e.amount), money(e.tax_amount), (e.deduction_percentage ?? 0) + '%']),
        note
      };
    }

    // ---- AI ----
    function systemPrompt() {
      return `Convert the user's request about a PAN register into ONE JSON object. Today is ${new Date().toISOString().slice(0, 10)}.
Indian financial year: 1 April to 31 March (FY 2024-25 = 2024-04-01 to 2025-03-31; Q1 Apr-Jun, Q2 Jul-Sep, Q3 Oct-Dec, Q4 Jan-Mar).
Table "entries": pan_number (AAAAA9999A), name, date (YYYY-MM-DD), amount, tax_amount, deduction_percentage.
Keys (action and reply are ALWAYS required; leave out other keys that don't apply):
action: insert|search|summary|update|delete|dedupe|export|chat
reply: short, friendly plain text for the user (for greetings, greet back and offer help)
READING (search, summary, export):
where: list of {"field","op","value"}; field is a column above; op = eq|neq|gt|gte|lt|lte|between|contains|starts_with|in|is_empty|not_empty.
  between: value [from,to]. in: value list. "at/exactly/of 2%" = eq. "2% and above"/"at least" = gte. "above/more than" = gt. Names: contains.
sort: {"field","dir":"asc|desc"}. limit: number, for "top 5", "latest 10" etc.
summary only: group_by = month|quarter|financial_year|year|pan|name (optional); measures = list of count|sum_amount|sum_tax|avg_amount|avg_tax|avg_deduction|min_amount|max_amount (default count,sum_amount,sum_tax)
export only: format = excel|pdf (default excel)
CHANGING (insert, update, delete): pan, name, date (insert: entry date; update: NEW date), entry_date (update/delete: date of the existing entry meant), all_entries (true only if user clearly says all entries of the PAN), amount, tax_amount, deduction_percentage (insert values, or new values for update)
Rules: Never invent a PAN, name, date or amount; use only what the user said in this chat. insert needs pan+name; update/delete need pan.
dedupe = find/show/remove duplicate (double, repeated) entries in the register; it only shows them, the user confirms before anything is deleted; can use where.
search = list entries; summary = totals/counts/averages; export = file/download/Excel/xlsx/PDF (the app CAN make files). "those"/"that list" = reuse the previous request's where.
Files are imported with the paperclip button next to the message box; if the user asks to upload or import a file, use chat and tell them that.
chat = greetings, help, unclear or invalid requests; reply must say exactly what is missing or wrong.
Never claim success in reply; the app reports results.`;
    }

    async function callGroq(model, messages, maxTokens) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
      try {
        const { data: { session: current } } = await supabase.auth.getSession();
        const res = await fetch(AI_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + current?.access_token, 'apikey': supabaseAnonKey },
          signal: controller.signal,
          body: JSON.stringify({
            model,
            reasoning_effort: 'low',
            response_format: { type: 'json_object' },
            temperature: 0,
            max_tokens: maxTokens,
            messages
          })
        });
        const data = await res.json();
        if (res.ok) return { json: JSON.parse(data.choices[0].message.content) };
        return { status: res.status, error: new Error(data?.error?.message || ('HTTP ' + res.status)) };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function askGroqJSON(messages, maxTokens, onStatus = () => {}) {
      let lastError;
      for (const model of GROQ_MODELS) {
        let result = await callGroq(model, messages, maxTokens);
        // Rate-limited for only a few seconds: wait once and retry the same model
        const m = result.status === 429 && result.error.message.match(/try again in ([\d.]+)(ms|s)/);
        const wait = m ? parseFloat(m[1]) / (m[2] === 'ms' ? 1000 : 1) : Infinity;
        if (wait <= 8) {
          onStatus(`The AI is busy, retrying in ${Math.ceil(wait)}s…`);
          await sleep(wait * 1000 + 300);
          result = await callGroq(model, messages, maxTokens);
        }
        if (result.json) return result.json;
        lastError = result.error;
        // Only move on to the next model when this one is rate-limited or down
        if (result.status !== 429 && result.status < 500) break;
      }
      throw lastError;
    }

    function askAI(text, history, onStatus) {
      const messages = [
        { role: 'system', content: systemPrompt() },
        ...history.slice(-6).map(m => ({
          role: m.role,
          // Include the earlier action so follow-ups ("that list as PDF") can reuse its filters
          content: m.action ? 'Action: ' + JSON.stringify(m.action) + '\nResult: ' + messageText(m).slice(0, 300) : messageText(m).slice(0, 600)
        })),
        { role: 'user', content: text }
      ];
      return askGroqJSON(messages, 250, onStatus);
    }

    // ---- Local fallback parser (used only if the AI is unreachable) ----
    function parseLocally(text) {
      const panMatch = text.match(/\b([a-z]{5}\d{4}[a-z])\b/i);
      const pan = panMatch ? panMatch[1].toUpperCase() : null;
      const num = (re) => { const m = text.match(re); return m ? parseFloat(m[1].replace(/,/g, '')) : null; };

      const entry = text.match(/enter\s+pan\s+([a-z0-9]+)\s+for\s+(.+?)(?:\s+on\s+(\d{4}-\d{2}-\d{2}))?(?:\s+with\s+amount\s+(-?[\d,.]+))?(?:\s+and\s+tax\s+(-?[\d,.]+))?(?:\s+and\s+deduction\s+(-?[\d.]+)%?)?\s*$/i);
      if (entry) {
        return {
          action: 'insert', pan: entry[1].toUpperCase(), name: entry[2].trim(), date: entry[3] || null,
          amount: entry[4] ? parseFloat(entry[4].replace(/,/g, '')) : null,
          tax_amount: entry[5] ? parseFloat(entry[5].replace(/,/g, '')) : null,
          deduction_percentage: entry[6] ? parseFloat(entry[6]) : null
        };
      }
      if (/\b(excel|xlsx|spreadsheet|pdf|export|download)\b/i.test(text)) {
        return { action: 'export', pan, format: /\bpdf\b/i.test(text) ? 'pdf' : 'excel' };
      }
      if (/\b(duplicates?|dupes?|double entr|repeated entr)/i.test(text)) return { action: 'dedupe', pan };
      if (/^\s*(delete|remove)\b/i.test(text)) return { action: 'delete', pan };
      if (/^\s*update\b/i.test(text)) {
        return {
          action: 'update', pan,
          amount: num(/amount\s+to\s+([\d,.]+)/i),
          tax_amount: num(/tax\s+to\s+([\d,.]+)/i),
          deduction_percentage: num(/deduction\s+to\s+([\d.]+)/i)
        };
      }
      if (/\b(total|sum|count|how many)\b/i.test(text)) return { action: 'summary', pan };
      if (/\b(show|find|get|list|display|search)\b/i.test(text)) {
        const prefix = text.match(/starting\s+with\s+([a-z0-9]+)/i);
        const exact = !/above|below|more|less|over|under/i.test(text) && num(/deduction[^\d]*?(?:at|of|=|is|exactly|equal\s+to)?\s*([\d.]+)\s*%?/i);
        return {
          action: 'search', pan,
          pan_prefix: prefix ? prefix[1].toUpperCase() : null,
          min_deduction: num(/deduction[^\d]*above\s+([\d.]+)/i),
          max_deduction: num(/deduction[^\d]*below\s+([\d.]+)/i),
          where: isNum(exact) ? [{ field: 'deduction_percentage', op: 'eq', value: exact }] : []
        };
      }
      return { action: 'chat', reply: 'Sorry, I couldn\'t understand that. Try something like "Show me all entries" or "Enter PAN ABCDE1234F for John Doe on 2024-01-15 with amount 5000".' };
    }

    // ---- Database queries ----
    // The AI describes what to read (any column, comparison, sorting, top-N); this code checks
    // every part before running it, and only ever reads. Changes go through the fixed actions below.
    const FIELD_TYPES = { pan_number: 'text', name: 'text', date: 'date', amount: 'num', tax_amount: 'num', deduction_percentage: 'num' };
    const FIELD_ALIASES = { pan: 'pan_number', tax: 'tax_amount', deduction: 'deduction_percentage', percent: 'deduction_percentage' };
    const FIELD_LABELS = { pan_number: 'PAN', name: 'name', date: 'date', amount: 'amount', tax_amount: 'tax', deduction_percentage: 'deduction' };
    const OPS = ['eq', 'neq', 'gt', 'gte', 'lt', 'lte', 'between', 'contains', 'starts_with', 'in', 'is_empty', 'not_empty'];

    function fieldName(f) {
      const key = String(f || '').trim().toLowerCase();
      return FIELD_ALIASES[key] || key;
    }

    function convertValue(field, v) {
      const type = FIELD_TYPES[field];
      if (type === 'num') { const n = parseNum(v); return typeof n === 'number' ? n : null; }
      if (type === 'date') return normDate(v);
      const t = String(v ?? '').trim().slice(0, 100);
      return t ? (field === 'pan_number' ? t.toUpperCase() : t) : null;
    }

    function checkCondition(c) {
      const field = fieldName(c && c.field);
      const op = String(c && c.op || '').toLowerCase();
      const what = (c && c.field) + ' ' + op;
      if (!FIELD_TYPES[field]) return { why: `unknown column "${c && c.field}"` };
      if (!OPS.includes(op)) return { why: `"${op}" on ${FIELD_LABELS[field]}` };
      const type = FIELD_TYPES[field];
      if (['contains', 'starts_with'].includes(op) && type !== 'text') return { why: what };
      if (['gt', 'gte', 'lt', 'lte', 'between'].includes(op) && type === 'text') return { why: what };
      if (op === 'is_empty' || op === 'not_empty') return { cond: { field, op } };
      if (op === 'between') {
        const vals = Array.isArray(c.value) ? c.value.map(v => convertValue(field, v)) : [];
        if (vals.length !== 2 || vals.includes(null)) return { why: what };
        return { cond: { field, op, value: vals[0] <= vals[1] ? vals : [vals[1], vals[0]] } };
      }
      if (op === 'in') {
        const vals = (Array.isArray(c.value) ? c.value : [c.value]).slice(0, 50).map(v => convertValue(field, v)).filter(v => v !== null);
        if (!vals.length) return { why: what };
        return { cond: { field, op, value: vals } };
      }
      const value = convertValue(field, c.value);
      if (value === null) return { why: `${FIELD_LABELS[field]} ${op} "${c.value}"` };
      return { cond: { field, op, value } };
    }

    // Turn an action into checked conditions, sort and limit. Older saved requests used fixed keys; they still work.
    function normalizeQuery(a) {
      const conds = [];
      const ignored = [];
      const add = (c) => { const r = checkCondition(c); r.cond ? conds.push(r.cond) : ignored.push(r.why); };
      if (a.pan) add({ field: 'pan_number', op: 'eq', value: a.pan });
      else if (a.pan_prefix) add({ field: 'pan_number', op: 'starts_with', value: a.pan_prefix });
      if (a.name) add({ field: 'name', op: 'contains', value: a.name });
      if (a.date_from) add({ field: 'date', op: 'gte', value: a.date_from });
      if (a.date_to) add({ field: 'date', op: 'lte', value: a.date_to });
      if (isNum(a.min_amount)) add({ field: 'amount', op: 'gte', value: a.min_amount });
      if (isNum(a.max_amount)) add({ field: 'amount', op: 'lte', value: a.max_amount });
      if (isNum(a.min_deduction)) add({ field: 'deduction_percentage', op: 'gt', value: a.min_deduction });
      if (isNum(a.max_deduction)) add({ field: 'deduction_percentage', op: 'lt', value: a.max_deduction });
      (Array.isArray(a.where) ? a.where : []).forEach(add);
      // A value given as a plain key when reading ("deduction_percentage": 2) means "equals"
      ['amount', 'tax_amount', 'deduction_percentage', 'date'].forEach(k => {
        if (a[k] != null && a[k] !== '' && !conds.some(c => c.field === k)) add({ field: k, op: 'eq', value: a[k] });
      });

      let sort = null;
      if (a.sort && FIELD_TYPES[fieldName(a.sort.field)]) sort = { field: fieldName(a.sort.field), dir: a.sort.dir === 'asc' ? 'asc' : 'desc' };
      else if (a.sort && a.sort.field) sort = { measure: String(a.sort.field), dir: a.sort.dir === 'asc' ? 'asc' : 'desc' };
      const n = Math.floor(Number(a.limit));
      const limit = n >= 1 ? Math.min(n, 1000) : null;
      return { conds, ignored, sort, limit };
    }

    const likeEscape = (v) => String(v).replace(/[\\%_]/g, m => '\\' + m);

    function applyConds(query, conds) {
      conds.forEach(({ field, op, value }) => {
        if (op === 'eq') query = field === 'name' ? query.ilike(field, likeEscape(value)) : query.eq(field, value);
        else if (op === 'neq') query = query.neq(field, value);
        else if (op === 'gt') query = query.gt(field, value);
        else if (op === 'gte') query = query.gte(field, value);
        else if (op === 'lt') query = query.lt(field, value);
        else if (op === 'lte') query = query.lte(field, value);
        else if (op === 'between') query = query.gte(field, value[0]).lte(field, value[1]);
        else if (op === 'contains') query = query.ilike(field, '%' + likeEscape(value) + '%');
        else if (op === 'starts_with') query = query.ilike(field, likeEscape(value) + '%');
        else if (op === 'in') query = query.in(field, value);
        else if (op === 'is_empty') query = query.is(field, null);
        else if (op === 'not_empty') query = query.not(field, 'is', null);
      });
      return query;
    }

    function orderQuery(query, q) {
      if (q.sort && q.sort.field) return query.order(q.sort.field, { ascending: q.sort.dir === 'asc', nullsFirst: false }).order('created_at', { ascending: false });
      return query.order('date', { ascending: true, nullsFirst: false }).order('created_at', { ascending: true });
    }

    // Supabase returns at most 1000 rows per request, so page through everything
    async function fetchAllEntries(q) {
      const all = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await orderQuery(applyConds(supabase.from('entries').select('*'), q.conds), q).range(from, from + 999);
        if (error) throw new Error(error.message);
        all.push(...data);
        if (q.limit && all.length >= q.limit) return all.slice(0, q.limit);
        if (data.length < 1000) return all;
      }
    }

    function showValue(field, v) {
      if (field === 'amount' || field === 'tax_amount') return money(v);
      if (field === 'deduction_percentage') return v + '%';
      if (FIELD_TYPES[field] === 'text') return '"' + v + '"';
      return v;
    }

    const OP_WORDS = { eq: '=', neq: '≠', gt: '>', gte: '≥', lt: '<', lte: '≤' };

    // Plain-English description of what was looked up, shown with every answer
    function describeQuery(q) {
      const parts = q.conds.map(({ field, op, value }) => {
        const label = FIELD_LABELS[field];
        if (OP_WORDS[op]) return `${label} ${OP_WORDS[op]} ${showValue(field, value)}`;
        if (op === 'between') return `${label} ${showValue(field, value[0])} to ${showValue(field, value[1])}`;
        if (op === 'contains') return `${label} contains ${showValue(field, value)}`;
        if (op === 'starts_with') return `${label} starts with ${showValue(field, value)}`;
        if (op === 'in') return `${label} is ${value.map(v => showValue(field, v)).join(' or ')}`;
        if (op === 'is_empty') return `no ${label}`;
        return `${label} filled in`;
      });
      if (q.sort) {
        const by = q.sort.field ? FIELD_LABELS[q.sort.field] : MEASURES[q.sort.measure]?.label.toLowerCase() || q.sort.measure;
        const numeric = !q.sort.field || FIELD_TYPES[q.sort.field] !== 'text';
        parts.push(`sorted by ${by}, ${q.sort.dir === 'asc' ? (numeric ? 'low to high' : 'A to Z') : (numeric ? 'high to low' : 'Z to A')}`);
      }
      if (q.limit) parts.push(`top ${q.limit}`);
      return parts;
    }

    function describeFilters(a) {
      const parts = describeQuery(normalizeQuery(a));
      return parts.length ? parts.join(', ') : 'all entries';
    }

    function filterBlock(q) {
      return { type: 'filter', parts: describeQuery(q), ignored: q.ignored };
    }

    // ---- Totals, averages and grouping (summary) ----
    const sumOf = (rows, k) => rows.reduce((s, e) => s + (Number(e[k]) || 0), 0);
    const MEASURES = {
      count: { label: 'Entries', calc: rows => rows.length, show: v => v.toLocaleString('en-IN') },
      sum_amount: { label: 'Total amount', calc: rows => sumOf(rows, 'amount'), show: money },
      sum_tax: { label: 'Total tax', calc: rows => sumOf(rows, 'tax_amount'), show: money },
      avg_amount: { label: 'Average amount', calc: rows => sumOf(rows, 'amount') / rows.length, show: money },
      avg_tax: { label: 'Average tax', calc: rows => sumOf(rows, 'tax_amount') / rows.length, show: money },
      avg_deduction: { label: 'Average deduction', calc: rows => sumOf(rows, 'deduction_percentage') / rows.length, show: v => (Math.round(v * 100) / 100) + '%' },
      min_amount: { label: 'Smallest amount', calc: rows => Math.min(...rows.map(e => Number(e.amount) || 0)), show: money },
      max_amount: { label: 'Largest amount', calc: rows => Math.max(...rows.map(e => Number(e.amount) || 0)), show: money }
    };

    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const fyStart = (d) => { const y = +d.slice(0, 4); return +d.slice(5, 7) >= 4 ? y : y - 1; };
    const fyLabel = (y) => `FY ${y}-${String(y + 1).slice(2)}`;

    // Each grouping gives [sort key, label] for an entry
    const GROUPS = {
      month: { label: 'Month', key: e => e.date ? [e.date.slice(0, 7), MONTH_NAMES[+e.date.slice(5, 7) - 1] + ' ' + e.date.slice(0, 4)] : null },
      quarter: {
        label: 'Quarter',
        key: e => {
          if (!e.date) return null;
          const m = +e.date.slice(5, 7);
          const q = m >= 4 && m <= 6 ? 1 : m >= 7 && m <= 9 ? 2 : m >= 10 ? 3 : 4;
          return [fyStart(e.date) + '-' + q, `Q${q} ${fyLabel(fyStart(e.date))}`];
        }
      },
      financial_year: { label: 'Financial year', key: e => e.date ? [String(fyStart(e.date)), fyLabel(fyStart(e.date))] : null },
      year: { label: 'Year', key: e => e.date ? [e.date.slice(0, 4), e.date.slice(0, 4)] : null },
      pan: { label: 'PAN', key: e => [e.pan_number, e.pan_number + (e.name ? ' · ' + e.name : '')] },
      name: { label: 'Name', key: e => [normName(e.name), e.name || '—'] }
    };

    function summarize(rows, a, q) {
      let measures = (Array.isArray(a.measures) ? a.measures : []).map(String).filter(m => MEASURES[m]);
      if (!measures.length) measures = ['count', 'sum_amount', 'sum_tax'];
      const group = GROUPS[a.group_by];

      if (!group) {
        return { type: 'stats', items: measures.map(m => ({ label: MEASURES[m].label, value: MEASURES[m].show(MEASURES[m].calc(rows)) })) };
      }

      const buckets = new Map();
      rows.forEach(e => {
        const k = group.key(e) || ['~', 'No date'];
        if (!buckets.has(k[0])) buckets.set(k[0], { label: k[1], rows: [] });
        buckets.get(k[0]).rows.push(e);
      });
      let list = [...buckets.entries()].map(([key, b]) => ({ key, label: b.label, values: Object.fromEntries(measures.map(m => [m, MEASURES[m].calc(b.rows)])) }));
      const sortMeasure = q.sort && q.sort.measure && MEASURES[q.sort.measure] ? q.sort.measure : null;
      if (sortMeasure) list.sort((x, y) => (x.values[sortMeasure] - y.values[sortMeasure]) * (q.sort.dir === 'asc' ? 1 : -1));
      else list.sort((x, y) => x.key < y.key ? -1 : x.key > y.key ? 1 : 0);
      if (q.limit) list = list.slice(0, q.limit);

      return {
        type: 'table',
        columns: [{ label: group.label, wrap: true }, ...measures.map(m => ({ label: MEASURES[m].label, num: true }))],
        rows: list.map(g => [g.label, ...measures.map(m => MEASURES[m].show(g.values[m]))])
      };
    }

    // The question mentioned numbers or conditions, but nothing could be used as a filter
    function nothingApplied(q, text) {
      return !q.conds.length && !q.limit && /\d|%|above|below|between|less|more|greater|over|under|starting|contain|named|before|after|since|from/i.test(text);
    }

    // ---- Excel / PDF export ----
    const EXPORT_HEAD = ['Sl.No', 'Organization / Name', 'PAN Number', 'Amount (₹)', 'Tax (₹)', 'Deduction (%)', 'Date of Entry'];

    // Rows in register form ({ pan_number, name, amount, ... }) -> downloaded .xlsx with a TOTAL row
    async function saveExcel(rows, fileName) {
      await loadScript(XLSX_URL);
      const sheetRows = [EXPORT_HEAD];
      rows.forEach((e, i) => sheetRows.push([
        i + 1, e.name || '', e.pan_number, Number(e.amount) || 0, Number(e.tax_amount) || 0, Number(e.deduction_percentage) || 0, e.date || ''
      ]));
      sheetRows.push([], ['', 'TOTAL', '', sumOf(rows, 'amount'), sumOf(rows, 'tax_amount'), '', '']);
      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      ws['!cols'] = [{ wch: 7 }, { wch: 32 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 13 }, { wch: 13 }];
      for (let r = 2; r <= sheetRows.length; r++) {
        ['D', 'E'].forEach(col => { const c = ws[col + r]; if (c && c.t === 'n') c.z = '#,##0.00'; });
      }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'PAN Entries');
      XLSX.writeFile(wb, fileName);
    }

    async function exportEntries(a) {
      const format = a.format === 'pdf' ? 'pdf' : 'excel';
      const rows = await fetchAllEntries(normalizeQuery(a));
      if (!rows.length) return 'No entries match (' + describeFilters(a) + '), so there is nothing to export.';

      const totalAmount = rows.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const totalTax = rows.reduce((s, e) => s + (Number(e.tax_amount) || 0), 0);
      const fileName = 'PAN_Entries_' + new Date().toISOString().slice(0, 10) + (format === 'pdf' ? '.pdf' : '.xlsx');

      if (format === 'excel') {
        await saveExcel(rows, fileName);
      } else {
        await loadScript(JSPDF_URL);
        await loadScript(AUTOTABLE_URL);
        // The built-in PDF font has no ₹ glyph, so use "Rs." like the Display page
        const rs = (v) => 'Rs. ' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.setFontSize(16);
        doc.text('PAN Entries Report', 14, 20);
        doc.setFontSize(10);
        // The PDF's built-in font has no ₹ ≥ ≤ ≠ glyphs
        const pdfFilter = describeFilters(a).replace(/₹/g, 'Rs. ').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/≠/g, '!=');
        doc.text('Generated: ' + new Date().toLocaleString('en-IN') + '   |   Filter: ' + pdfFilter, 14, 27);
        doc.autoTable({
          head: [EXPORT_HEAD.map(h => h.replace('₹', 'Rs.'))],
          body: rows.map((e, i) => [i + 1, e.name || '', e.pan_number, rs(e.amount), rs(e.tax_amount), (e.deduction_percentage ?? 0) + '%', e.date || '']),
          foot: [['', 'TOTAL (' + rows.length + ' entries)', '', rs(totalAmount), rs(totalTax), '', '']],
          startY: 32,
          styles: { fontSize: 9, cellPadding: 3 },
          headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
          footStyles: { fillColor: [238, 242, 255], textColor: [30, 41, 59], fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [248, 250, 252] }
        });
        doc.save(fileName);
      }

      // Same audit trail as the Display page exports
      supabase.from('audit_log').insert({
        action: format === 'pdf' ? 'EXPORT_PDF' : 'EXPORT_CSV',
        table_name: 'entries',
        details: { source: 'chat', format, rowCount: rows.length, filters: describeFilters(a) }
      }).then(() => {}, () => {});

      return { fileName, count: rows.length, totalAmount, totalTax };
    }

    // ---- Same safety rules as the Quick Entry / Full Entry / Import pages ----
    function isValidPAN(pan) {
      return /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(String(pan).toUpperCase());
    }

    function isRealDate(d) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
      const dt = new Date(d + 'T00:00:00Z');
      return !isNaN(dt) && dt.toISOString().slice(0, 10) === d;
    }

    // Amount/tax must be >= 0, deduction 0-100, date a real calendar date (same limits as Full Entry)
    function checkValues(v) {
      if (v.amount != null && (!isNum(v.amount) || v.amount < 0)) return 'Amount must be a number of 0 or more.';
      if (v.tax_amount != null && (!isNum(v.tax_amount) || v.tax_amount < 0)) return 'Tax must be a number of 0 or more.';
